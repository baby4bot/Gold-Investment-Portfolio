    async function fetchGoldFromSheet() { 
        const sheetId = '1Edz3ycTQofuWH9KvV7mKWNh9yzDjDFmCYglD5MSyn3E'; 
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=0&t=${new Date().getTime()}`; 
        try { 
            const response = await fetch(csvUrl); 
            if (!response.ok) return; 
            const data = await response.text(); 
            const parseCSV = (str) => { 
                let res = [], cur = '', inQ = false; 
                for (let i = 0; i < str.length; i++) { 
                    let c = str[i]; 
                    if (c === '"') inQ = !inQ; 
                    else if (c === ',' && !inQ) { res.push(cur.trim()); cur = ''; } 
                    else cur += c; 
                } 
                res.push(cur.trim()); 
                return res; 
            }; 
            const rows = data.split('\n').map(parseCSV); 
            const cleanNum = (str) => str ? parseFloat(str.replace(/[^0-9.-]+/g, '')) : 0; 
            
            let csvDate = rows[2] ? rows[2][17] : '--'; 
            let csvTime = rows[2] ? rows[2][19] : '--'; 
            
            let bBuyStr   = rows[4] ? rows[4][18] : '';   
            let bSellStr  = rows[4] ? rows[4][19] : '';   
            
            let oBuyStr   = rows[6] ? rows[6][18] : '';   
            let oSellStr  = rows[6] ? rows[6][19] : '';   
            
            let chgStr    = rows[3] ? rows[3][20] : '';   
            
            let newPrice = cleanNum(bBuyStr); 
            
            let bBuyNum = cleanNum(bBuyStr);
            let bSellNum = cleanNum(bSellStr);
            let oBuyNum = cleanNum(oBuyStr);
            let oSellNum = cleanNum(oSellStr);

            let isDataComplete = (bBuyNum > 0 && bSellNum > 0 && oBuyNum > 0 && oSellNum > 0);

            if (newPrice > 0 && isDataComplete) {
                
                if (db && csvDate !== '--' && csvTime !== '--') {
                    // เช็คซ้ำโดยเทียบ date+time+barBuy กับ allHistoryData
                    const csvIsDuplicate = allHistoryData && allHistoryData.some(h =>
                        h.date === csvDate && h.time === csvTime && h.barBuy === bBuyNum
                    );
                    if (!csvIsDuplicate) {
                        let safeDate = csvDate.replace(/[\s\/]/g, '');
                        let safeTime = csvTime.replace(/[\s\.:น]/g, '');
                        let recordKey = `H_${safeDate}_${safeTime}_${bBuyNum}`;
                        db.ref('gold_price_history/' + recordKey).set({
                            price: newPrice,
                            barBuy: bBuyNum,
                            barSell: bSellNum,
                            ornamentBuy: oBuyNum,
                            ornamentSell: oSellNum,
                            date: csvDate,
                            time: csvTime,
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    }
                }

                let priceChanged = (newPrice !== currentGoldBuyPrice); 
                previousGoldBuyPrice = currentGoldBuyPrice;
                currentGoldBuyPrice = newPrice;
                isFirstLoad = false;
                
                if(priceChanged && transactionsData.length > 0) renderData(); 
            }
        } catch (error) {} 
    }

    function handleImgBase(input, callback) { const file = input.target ? input.target.files[0] : (input.files ? input.files[0] : null); if (!file) return; const reader = new FileReader(); reader.onload = function(e) { const img = new Image(); img.onload = function() { const canvas = document.createElement('canvas'); const MAX_SIZE = 400; let width = img.width; let height = img.height; if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } } canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); callback(canvas.toDataURL('image/jpeg', 0.8)); }; img.src = e.target.result; }; reader.readAsDataURL(file); }

    let _swipeStartX = 0, _swipeStartY = 0;
    function openModal(index) { 
        if(index < 0 || index >= currentViewList.length) return; 
        activeModalIndex = index; updateModalUI(); 
        document.getElementById('item-modal').classList.remove('opacity-0', 'pointer-events-none'); 
        document.getElementById('item-modal').classList.add('opacity-100');
        document.body.style.overflow = 'hidden';
        // Setup swipe gestures
        const modal = document.getElementById('item-modal');
        modal.ontouchstart = function(e) { _swipeStartX = e.touches[0].clientX; _swipeStartY = e.touches[0].clientY; };
        modal.ontouchend = function(e) {
            const dx = e.changedTouches[0].clientX - _swipeStartX;
            const dy = e.changedTouches[0].clientY - _swipeStartY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                if (dx < 0 && activeModalIndex < currentViewList.length - 1) { activeModalIndex++; updateModalUI(); }
                else if (dx > 0 && activeModalIndex > 0) { activeModalIndex--; updateModalUI(); }
            }
        };
    }    function closeModal(e) {

        document.getElementById('item-modal').classList.add('opacity-0', 'pointer-events-none');
        document.body.style.overflow = 'auto'; activeModalIndex = -1;

    function nextModal(e) {

    // === Changelog Modal ===
    function openChangelog() { document.getElementById('changelog-modal').classList.remove('hidden'); }

    // === Version Update System (localStorage + Firebase) ===
    let currentVersion = { major: 1, minor: 2, patch: 6 };
    const VER_KEY = 'goldApp_versionData';
    const FEATURE_KEY = 'goldApp_featureScan';
    // === Feature Scanner: สแกนโครงสร้างโค้ดอัตโนมัติ ===
    function scanCurrentFeatures() {
        const features = { functions: [], buttons: [], modals: [], forms: [], menus: [], misc: [] };
        try {
            // สแกน function declarations
            const funcRegex = /function\s+(\w+)\s*\(/g;
            let match;
            while ((match = funcRegex.exec(document.documentElement.outerHTML)) !== null) {
                const name = match[1];
                if (!name.startsWith('_') && name.length > 3 && name !== 'HTMLHtmlElement') features.functions.push(name);
            }
            features.functions = [...new Set(features.functions)].sort();
            // สแกนปุ่ม/menu จาก UI
            document.querySelectorAll('button').forEach(btn => {
                const text = btn.textContent.trim().replace(/\s+/g, ' ').substring(0, 50);
                if (text && text.length > 1 && !text.match(/^[✕✕\d.]+$/)) features.buttons.push(text);
            });
            features.buttons = [...new Set(features.buttons)].sort();
            // สแกน modals
            document.querySelectorAll('[id*="modal"], [id*="Modal"]').forEach(el => {
                features.modals.push(el.id);
            });
            features.modals = [...new Set(features.modals)].sort();
            // สแกน forms
            document.querySelectorAll('form').forEach(f => {
                const id = f.id || f.getAttribute('onsubmit') || 'form-' + features.forms.length;
                features.forms.push(id);
            });
            features.forms = [...new Set(features.forms)].sort();
            // สแกน nav/side menu items
            document.querySelectorAll('#side-menu-content button, nav button').forEach(btn => {
                const text = btn.textContent.trim().replace(/\s+/g, ' ');
                if (text.length > 2) features.menus.push(text);
            });
            features.menus = [...new Set(features.menus)].sort();
        } catch(e) { console.warn('Feature scan error:', e); }
        return features;
    }
    function featuresToKeys(features) {
        const keys = [];
        features.functions.forEach(f => keys.push('fn:' + f));
        features.buttons.forEach(b => keys.push('btn:' + b));
        features.modals.forEach(m => keys.push('modal:' + m));
        features.forms.forEach(f => keys.push('form:' + f));
        features.menus.forEach(m => keys.push('menu:' + m));
        return keys.sort();
    }
    function detectRecentChanges() {
        const current = scanCurrentFeatures();
        const currentKeys = featuresToKeys(current);
        const prevData = JSON.parse(localStorage.getItem(FEATURE_KEY) || 'null');
        if (!prevData) {
            localStorage.setItem(FEATURE_KEY, JSON.stringify({ keys: currentKeys, features: current }));
            return '';
        }
        const prevKeys = new Set(prevData.keys || []);
        const added = currentKeys.filter(k => !prevKeys.has(k));
        const removed = (prevData.keys || []).filter(k => !currentKeys.includes(k));
        const changes = [];
        // จัดกลุ่ม added features
        const addedFn = added.filter(k => k.startsWith('fn:')).map(k => k.replace('fn:', ''));
        const addedBtn = added.filter(k => k.startsWith('btn:')).map(k => k.replace('btn:', ''));
        const addedModal = added.filter(k => k.startsWith('modal:')).map(k => k.replace('modal:', ''));
        const addedForm = added.filter(k => k.startsWith('form:')).map(k => k.replace('form:', ''));
        const addedMenu = added.filter(k => k.startsWith('menu:')).map(k => k.replace('menu:', ''));
        if (addedFn.length > 0) changes.push('🆕 เพิ่มฟังก์ชันใหม่: ' + addedFn.join(', '));
        if (addedBtn.length > 0) changes.push('🆕 เพิ่มปุ่ม/ไอคอนใหม่: ' + addedBtn.join(', '));
        if (addedModal.length > 0) changes.push('🆕 เพิ่ม Modal ใหม่: ' + addedModal.join(', '));
        if (addedForm.length > 0) changes.push('🆕 เพิ่มฟอร์มใหม่: ' + addedForm.join(', '));
        if (addedMenu.length > 0) changes.push('🆕 เพิ่มเมนูใหม่: ' + addedMenu.join(', '));
        // จัดกลุ่ม removed features
        const removedFn = removed.filter(k => k.startsWith('fn:')).map(k => k.replace('fn:', ''));
        const removedBtn = removed.filter(k => k.startsWith('btn:')).map(k => k.replace('btn:', ''));
        if (removedFn.length > 0) changes.push('❌ ลบฟังก์ชัน: ' + removedFn.join(', '));
        if (removedBtn.length > 0) changes.push('❌ ลบปุ่ม/ไอคอน: ' + removedBtn.join(', '));
        // บันทึก snapshot ปัจจุบัน
        localStorage.setItem(FEATURE_KEY, JSON.stringify({ keys: currentKeys, features: current }));
        return changes.join('\n');
    }
    function parseVersion(v) { const m = v.match(/v?(\d+)\.(\d+)\.(\d+)/); return m ? { major: +m[1], minor: +m[2], patch: +m[3] } : { major: 1, minor: 1, patch: 0 }; }
    function versionToString(v) { return 'v' + v.major + '.' + v.minor + '.' + v.patch; }
    function getTodayStr() {
        const now = new Date();
        const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        return now.getDate() + ' ' + months[now.getMonth()] + ' ' + (now.getFullYear() + 543);
    }
    function loadLocalVersionData() {
        try { return JSON.parse(localStorage.getItem(VER_KEY)) || { version: 'v1.2.2', entries: [] }; } catch(e) { return { version: 'v1.2.2', entries: [] }; }
    }
    function saveLocalVersionData(data) { localStorage.setItem(VER_KEY, JSON.stringify(data)); }
    function loadVersionFromFirebase() {
        // Hardcoded version is always authoritative — sync TO Firebase, never FROM it
        const hardcodedVer = Object.assign({}, currentVersion);
        currentVersion = hardcodedVer;
        updateVersionDisplay();
        if (db) {
            db.ref('app_settings/version').set({ version: versionToString(currentVersion) });
        }
    }
    function compareVersions(a, b) {
        if (a.major !== b.major) return a.major - b.major;
        if (a.minor !== b.minor) return a.minor - b.minor;
        return a.patch - b.patch;
    }
    function updateVersionDisplay() {
        const vs = versionToString(currentVersion);
        document.querySelectorAll('button[onclick="openChangelog()"]').forEach(b => {
            b.innerHTML = '<i class="ph ph-tag" style="font-size: 12px;"></i> ' + vs;

        const h = document.querySelector('#changelog-modal h3');
        if (h) h.innerHTML = '<i class="ph ph-tag"></i> เวอร์ชัน ' + vs;
    }

    function updateNextVersion() {
        const type = document.getElementById('version-bump-type').value;
        let next = Object.assign({}, currentVersion);
        if (type === 'patch') next.patch++;
        else if (type === 'minor') { next.minor++; next.patch = 0; }
        else { next.major++; next.minor = 0; next.patch = 0; }
        document.getElementById('next-version-display').textContent = versionToString(next);
    }
    document.addEventListener('DOMContentLoaded', () => {

    function submitVersionUpdate() {
        const type = document.getElementById('version-bump-type').value;
        const changelogText = document.getElementById('changelog-input').value.trim();
        if (!changelogText) { showWarningToast('\u26a0\ufe0f \u0e01\u0e23\u0e38\u0e07\u0e40\u0e01\u0e32\u0e30\u0e01\u0e23\u0e23\u0e14\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e2d\u0e1a\u0e40\u0e1e\u0e23\u0e32\u0e30\u0e40\u0e17\u0e1e'); return; }
        let next = Object.assign({}, currentVersion);
        if (type === 'patch') next.patch++;
        else if (type === 'minor') { next.minor++; next.patch = 0; }
        else { next.major++; next.minor = 0; next.patch = 0; }
        const newVersion = versionToString(next);
        const dateStr = getTodayStr();
        const items = changelogText.split('\n').filter(l => l.trim()).map(l => {
            l = l.trim();
            if (!l.match(/^[\u2795\u2796\u2797\u2794\ud83c\udf1f\ud83c\udfa8\u26a1\ud83d\udd10\ud83d\udd13\ud83d\udcca\ud83d\udcf1\ud83d\udd04\u2728\ud83c\udfaf\ud83d\udee1]/)) l = '\u2705 ' + l;
            return '<li>' + l + '</li>';
        }).join('');
        const newEntry = { version: newVersion, date: dateStr, items: items, timestamp: Date.now() };
        // Save version to Firebase
        if (db) db.ref('app_settings/version').set({ version: newVersion });
        // Merge same-day entries in both Firebase and localStorage
        let localData = loadLocalVersionData();
        localData.version = newVersion;
        const todayEntry = localData.entries.find(e => e.date === dateStr);
        if (todayEntry) {
            todayEntry.items += items;
            todayEntry.version = todayEntry.version.split(' \u2192 ').pop() + ' \u2192 ' + newVersion;
            todayEntry.timestamp = Date.now();
            // Update Firebase entry
            if (db) db.ref('app_settings/changelog/' + todayEntry.version.replace(/\./g, '_')).set(todayEntry);
        } else {
            localData.entries.unshift(newEntry);
            if (db) db.ref('app_settings/changelog/' + newVersion.replace(/\./g, '_')).set(newEntry);
        }
        saveLocalVersionData(localData);
        currentVersion = next;
        updateVersionDisplay();
        rebuildChangelogDOM(localData.entries);
        closeVersionUpdateModal();
        closeAdminSettingsModal();
        showWarningToast('\ud83c\udf89 \u0e2d\u0e31\u0e1b\u0e40\u0e14\u0e15\u0e22\u0e19 \u0e43\u0e2b\u0e21\u0e48 ' + newVersion + ' \u0e23\u0e2b\u0e31\u0e27\u0e23\u0e2d\u0e22!');
    }

            const editBtn = isAdmin ? '<button onclick="editChangelogEntry(\'' + verKey + '\')" style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background=\'rgba(255,255,255,0.12)\'" onmouseout="this.style.background=\'rgba(255,255,255,0.06)\'"><i class=\'ph ph-pencil-simple\' style=\'color:#60a5fa;font-size:14px;\'></i></button>' : '';
            container.innerHTML += '<div class="p-3 rounded-xl changelog-entry-card" style="background: var(--bg-elevated, rgba(0,0,0,0.3)); border: 1px solid var(--border-primary, rgba(255,255,255,0.06));" id="changelog-entry-' + verKey + '"><div class="flex items-center gap-2 mb-2"><span class="px-2 py-0.5 rounded-full text-[10px] font-black" style="background: ' + bgColor + ';">' + entry.version + '</span><span class="text-xs font-bold flex-1" style="color: var(--text-secondary, #94a3b8);">' + (entry.date || '') + '</span>' + editBtn + '</div><ul class="text-xs space-y-1 changelog-items" style="color: var(--text-secondary, #94a3b8);">' + entry.items + '</ul></div>';
        });
    }
    function editChangelogEntry(verKey) {
        if (currentRole !== 'admin') return showWarningToast('❌ เฉพาะ Admin เท่านั้นที่แก้ไขได้');
        const entry = document.getElementById('changelog-entry-' + verKey);
        if (!entry) return;

        ul.innerHTML = '<li><textarea id="edit-changelog-' + verKey + '" rows="5" style="width:100%; background: rgba(0,0,0,0.4); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; font-size: 13px; resize: vertical; font-family: inherit; outline: none;">' + items + '</textarea></li>';

    function cancelChangelogEdit(verKey) {
        // Just reload from Firebase to cancel
        _changelogFirebaseLoaded = false;
        loadChangelogFromFirebase();
    }
    let _changelogFirebaseLoaded = false;
    let _changelogListener = null;
    function saveChangelogEdit(verKey) {
        if (currentRole !== 'admin') return showWarningToast('❌ ไม่ใช่ Admin');
        const textarea = document.getElementById('edit-changelog-' + verKey);
        if (!textarea) return showWarningToast('❌ ไม่พบ textarea');
        const text = textarea.value.trim();
        if (!text) return showWarningToast('❌ กรุณากรอกข้อความ');
        const items = text.split('\n').filter(l => l.trim()).map(l => {
            return '<li>' + l.trim() + '</li>';
        }).join('');
        if (!db) return showWarningToast('❌ ไม่เชื่อมต่อ Firebase');
        const version = verKey.replace(/_/g, '.');
        const savePath = 'app_settings/changelog/' + verKey;
        db.ref(savePath).once('value').then(snap => {
            const existing = snap.val() || {};
            return db.ref(savePath).set({
                version: version,
                date: existing.date || '',
                items: items,
                timestamp: existing.timestamp || Date.now(),
                lastEdited: Date.now(),
                editedBy: (typeof currentUser !== 'undefined' && currentUser) ? currentUser.username : 'unknown'
            });
        }).then(() => {
            showWarningToast('✅ บันทึกเรียบร้อย!');
            // Detach old listener and reload
            if (_changelogListener) { db.ref('app_settings/changelog').off('value', _changelogListener); _changelogListener = null; }
            loadChangelogFromFirebase();
        }).catch(err => {
            console.error('SAVE ERROR:', err);
            showWarningToast('❌ บันทึกไม่สำเร็จ: ' + err.message);
        });
    }
    function loadChangelogFromStorage() {
        seedLocalStorageChangelog();
        const localData = loadLocalVersionData();
        if (localData.entries.length > 0) rebuildChangelogDOM(localData.entries);
    }
    function loadChangelogFromFirebase() {
        // If already listening, detach first
        if (_changelogListener) {
            db.ref('app_settings/changelog').off('value', _changelogListener);
            _changelogListener = null;
        }
        if (!db) {
            seedLocalStorageChangelog();
            const localData = loadLocalVersionData();
            rebuildChangelogDOM(localData.entries);
            return;
        }
        // Seed first, then listen
        seedLocalStorageChangelog();
        _changelogListener = db.ref('app_settings/changelog').orderByChild('timestamp').on('value', snap => {
            const fbEntries = [];
            snap.forEach(child => { const v = child.val(); if (v && v.version) fbEntries.push(v); });
            if (fbEntries.length === 0) {
                // No Firebase data — use localStorage and seed
                const localData = loadLocalVersionData();
                rebuildChangelogDOM(localData.entries);
                localData.entries.forEach(entry => {
                    const ek = entry.version.replace(/\./g, '_');
                    db.ref('app_settings/changelog/' + ek).once('value', s => {
                        if (!s.val()) db.ref('app_settings/changelog/' + ek).set(entry);
                    });
                });
                return;
            }
            fbEntries.reverse();
            rebuildChangelogDOM(fbEntries);
            // Also save to localStorage for offline
            let localData = loadLocalVersionData();
            localData.entries = fbEntries;
            saveLocalVersionData(localData);
        });
    }

    let undoTimeout = null;

    function showUndoToast(message, undoFn) {
        clearTimeout(undoTimeout);

        const btn = document.getElementById('undo-toast-btn');
        text.textContent = message;

        btn.onclick = function() {

            hideUndoToast();
        };
        pendingUndoAction = undoFn;
        toast.classList.remove('hidden');
        toast.classList.add('show');
        undoTimeout = setTimeout(hideUndoToast, 5000);
    }

        toast.classList.add('hidden');

    }

    // === Pull-to-Refresh (Dashboard only) ===
    (function() {
        let startY = 0, pulling = false, refreshing = false;
        const indicator = document.getElementById('pull-refresh-indicator');
        const icon = document.getElementById('pull-refresh-icon');
        const txt = document.getElementById('pull-refresh-text');
        if(!indicator) return;
        function _isModalOpen() {
            var hm = document.getElementById('price-history-modal');
            if(hm && hm.style.display === 'flex') return true;
            var im = document.getElementById('item-modal');
            if(im && im.style.opacity === '1') return true;
            var lm = document.getElementById('login-modal');
            if(lm && lm.style.display !== 'none' && !lm.classList.contains('hidden')) return true;
            return false;
        }
        document.addEventListener('touchstart', function(e) {
            // Only allow pull-to-refresh on dashboard without modals
            if(currentView !== 'dashboard' || _isModalOpen()) { pulling = false; return; }
            if(window.scrollY === 0 && !refreshing) { startY = e.touches[0].clientY; pulling = true; }
        }, {passive: true});
        document.addEventListener('touchmove', function(e) {
            if(!pulling || refreshing) return;
            // Block pull-to-refresh if not on dashboard or modal open
            if(currentView !== 'dashboard' || _isModalOpen()) { pulling = false; return; }
            let diff = e.touches[0].clientY - startY;
            if(diff > 0 && diff < 150) {
                indicator.style.transform = 'translateY(' + (diff - 64) + 'px)';
                if(diff > 80) { txt.textContent = 'ปล่อยเพื่อรีเฟรช'; icon.style.animation = 'spin 0.5s linear infinite'; }
                else { txt.textContent = 'ดึงลงเพื่อรีเฟรช'; icon.style.animation = 'spin 1s linear infinite'; }
            }
        }, {passive: true});
        document.addEventListener('touchend', function(e) {
            if(!pulling || refreshing) return;
            pulling = false;
            if(_isModalOpen()) return;
            let endY = e.changedTouches[0].clientY;
            if(endY - startY > 80) {
                refreshing = true;
                indicator.style.transform = 'translateY(0)';
                txt.textContent = 'กำลังรีเฟรช...';
                setTimeout(function() { location.reload(); }, 1000);
            } else {
                indicator.style.transform = 'translateY(-100%)';
            }
        }, {passive: true});
    })();

        html += '</div>';
        // Hidden file input for template image

        // Buttons - matching theme style

        html += '<button onclick="document.getElementById(\'cle-file-input\').click()" class="py-3.5 px-4 rounded-2xl font-bold text-sm flex items-center justify-center" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;"><i class="ph ph-image text-lg"></i></button>';
        html += '<button id="cle-reset-btn" onclick="cleResetDefaults()" class="py-3.5 px-4 rounded-2xl font-bold text-sm flex items-center justify-center" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;"><i class="ph ph-arrow-counter-clockwise text-lg"></i></button>';
        html += '<button onclick="cleTestCapture()" class="py-3.5 px-4 rounded-2xl font-bold text-sm flex items-center justify-center" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;"><i class="ph ph-camera text-lg"></i></button>';
        html += '<button id="cle-save-btn" onclick="cleSaveLayout()" class="py-3.5 px-4 rounded-2xl font-bold text-sm flex items-center justify-center" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;"><i class="ph ph-floppy-disk text-lg"></i></button>';
        html += '</div>';
        html += '</div></div>';

        document.body.insertAdjacentHTML('beforeend', html);

        // Load template image (check localStorage for custom template)
        const tplImg = document.getElementById('cle-tpl');
        const customTpl = localStorage.getItem('captureTemplateB64');
        tplImg.src = customTpl || GOLD_TEMPLATE_B64;

        // Draw grid
        const gridCanvas = document.getElementById('cle-grid');
        const gCtx = gridCanvas.getContext('2d');
        gCtx.strokeStyle = 'rgba(212,160,23,0.4)';
        gCtx.lineWidth = 0.5;
        for (let x = 0; x <= displayW; x += 20) { gCtx.beginPath(); gCtx.moveTo(x, 0); gCtx.lineTo(x, displayH); gCtx.stroke(); }
        for (let y = 0; y <= displayH; y += 20) { gCtx.beginPath(); gCtx.moveTo(0, y); gCtx.lineTo(displayW, y); gCtx.stroke(); }

        // Create draggable elements
        const scaleX = displayW / NW;
        const scaleY = displayH / NH;
        const container = document.getElementById('cle-elements');
        // Multi-select state
        window._cleSelectedIds = window._cleSelectedIds || [];
        window._cleScaleX = scaleX;
        window._cleScaleY = scaleY;
        window._cleDirty = false; // tracks unsaved edits (enables/disables the save button)

        CAPTURE_ELEMENTS.forEach(el => {
            const pos = layout[el.id] || { x: el.defaultX, y: el.defaultY };
            const div = document.createElement('div');
            div.className = 'cle-draggable';
            div.dataset.id = el.id;
            div.style.cssText = 'position:absolute;display:flex;align-items:center;gap:2px;cursor:grab;user-select:none;touch-action:none;z-index:10;transition:box-shadow 0.2s, outline 0.2s;';
            div.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:' + el.color + ';flex-shrink:0;"></span><span style="font-size:10px;font-weight:700;color:' + el.color + ';white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,0.8);">' + el.label + '</span>';
            div.style.left = (pos.x * scaleX) + 'px';
            div.style.top = (pos.y * scaleY) + 'px';
            container.appendChild(div);

            // Touch/Mouse drag
            let isDragging = false, startX, startY;
            let didMove = false; // whether this drag actually moved anything
            let origPositions = {}; // Store original positions of ALL selected elements

            function onDown(e) {
                e.preventDefault();
                const isMultiSelect = e.ctrlKey || e.metaKey; // Ctrl or Cmd
                const touch = e.touches ? e.touches[0] : e;
                startX = touch.clientX; startY = touch.clientY;

                if (isMultiSelect) {
                    // Toggle this element in selection
                    toggleCleSelection(el.id);
                    return;
                }

                // If this element is not in selection, select only it
                if (!window._cleSelectedIds.includes(el.id)) {
                    selectCleElement(el.id);
                }

                isDragging = true;
                // Store original positions of all selected elements
                origPositions = {};
                window._cleSelectedIds.forEach(id => {
                    const d = document.querySelector('.cle-draggable[data-id="' + id + '"]');
                    if (d) origPositions[id] = { left: parseFloat(d.style.left), top: parseFloat(d.style.top) };
                });

                // Visual feedback
                window._cleSelectedIds.forEach(id => {
                    const d = document.querySelector('.cle-draggable[data-id="' + id + '"]');
                    if (d) { d.style.zIndex = '20'; d.style.boxShadow = '0 0 12px rgba(239,68,68,0.5)'; }
                });
            }

            function onMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - startX;
                const dy = touch.clientY - startY;
                if (dx !== 0 || dy !== 0) didMove = true;

                // Move ALL selected elements
                window._cleSelectedIds.forEach(id => {
                    const d = document.querySelector('.cle-draggable[data-id="' + id + '"]');
                    if (d && origPositions[id]) {
                        let newLeft = origPositions[id].left + dx;
                        let newTop = origPositions[id].top + dy;
                        newLeft = Math.max(0, Math.min(displayW - 20, newLeft));
                        newTop = Math.max(0, Math.min(displayH - 10, newTop));
                        d.style.left = newLeft + 'px';
                        d.style.top = newTop + 'px';
                    }
                });
                // Update coords display
                const mainDiv = document.querySelector('.cle-draggable[data-id="' + el.id + '"]');
                if (mainDiv) {
                    const tplX = Math.round(parseFloat(mainDiv.style.left) / scaleX);
                    const tplY = Math.round(parseFloat(mainDiv.style.top) / scaleY);
                    const count = window._cleSelectedIds.length;
                    document.getElementById('cle-coords').textContent = 'x: ' + tplX + ' y: ' + tplY + (count > 1 ? ' (' + count + ' items)' : '');
                }
            }

            function onUp() {
                isDragging = false;
                // Save positions for all selected elements
                window._cleSelectedIds.forEach(id => {
                    const d = document.querySelector('.cle-draggable[data-id="' + id + '"]');
                    if (d) {
                        d.style.zIndex = '10';
                        d.style.boxShadow = window._cleSelectedIds.includes(id) ? '0 0 8px rgba(212,160,23,0.4)' : 'none';
                        layout[id] = { x: Math.round(parseFloat(d.style.left) / scaleX), y: Math.round(parseFloat(d.style.top) / scaleY) };
                    }
                });
                if (didMove) {
                    window._cleDirty = true;
                    updateCleSaveButton();
                }
            }

            div.addEventListener('mousedown', onDown);
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            div.addEventListener('touchstart', onDown, { passive: false });
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onUp);
        });

        // === LASSO SELECTION (for mobile and desktop) ===
        let lassoActive = false, lassoStartX, lassoStartY;
        let lassoDiv = null;
        container.addEventListener('mousedown', function(e) {
            if (e.target !== container) return; // Only start on empty area
            if (e.ctrlKey || e.metaKey) return; // Don't start lasso with Ctrl
            lassoActive = true;
            const rect = container.getBoundingClientRect();
            lassoStartX = e.clientX - rect.left;
            lassoStartY = e.clientY - rect.top;
            // Clear selection if not holding Ctrl
            window._cleSelectedIds = [];
            updateCleSelectionVisuals();
            // Create lasso rectangle
            lassoDiv = document.createElement('div');
            lassoDiv.style.cssText = 'position:absolute;border:2px dashed #ef4444;background:rgba(239,68,68,0.1);pointer-events:none;z-index:50;border-radius:4px;';
            lassoDiv.style.left = lassoStartX + 'px';
            lassoDiv.style.top = lassoStartY + 'px';
            container.appendChild(lassoDiv);
        });
        document.addEventListener('mousemove', function(e) {
            if (!lassoActive || !lassoDiv) return;
            const rect = container.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const lx = Math.min(lassoStartX, cx);
            const ly = Math.min(lassoStartY, cy);
            const lw = Math.abs(cx - lassoStartX);
            const lh = Math.abs(cy - lassoStartY);
            lassoDiv.style.left = lx + 'px';
            lassoDiv.style.top = ly + 'px';
            lassoDiv.style.width = lw + 'px';
            lassoDiv.style.height = lh + 'px';
            // Highlight elements inside lasso
            document.querySelectorAll('.cle-draggable').forEach(d => {
                const dx = parseFloat(d.style.left) + 30;
                const dy = parseFloat(d.style.top) + 8;
                const inside = dx >= lx && dx <= lx + lw && dy >= ly && dy <= ly + lh;
                d.style.outline = inside ? '2px solid #d4a017' : 'none';
                d.style.outlineOffset = '2px';
            });
        });
        document.addEventListener('mouseup', function(e) {
            if (!lassoActive || !lassoDiv) return;
            lassoActive = false;
            const rect = container.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            const lx = Math.min(lassoStartX, cx);
            const ly = Math.min(lassoStartY, cy);
            const lw = Math.abs(cx - lassoStartX);
            const lh = Math.abs(cy - lassoStartY);
            // Select elements inside lasso
            if (lw > 5 || lh > 5) {
                window._cleSelectedIds = [];
                document.querySelectorAll('.cle-draggable').forEach(d => {
                    const dx = parseFloat(d.style.left) + 30;
                    const dy = parseFloat(d.style.top) + 8;
                    if (dx >= lx && dx <= lx + lw && dy >= ly && dy <= ly + lh) {
                        window._cleSelectedIds.push(d.dataset.id);
                    }
                });
                updateCleSelectionVisuals();
                if (window._cleSelectedIds.length > 0) {
                    document.getElementById('cle-controls').style.display = '';
                    document.getElementById('cle-selected-label').textContent = '\ud83c\udfaf ' + window._cleSelectedIds.length + ' รายการ';
                }
            }
            if (lassoDiv) { lassoDiv.remove(); lassoDiv = null; }
        });
        // Touch lasso for mobile
        container.addEventListener('touchstart', function(e) {
            if (e.target !== container) return;
            lassoActive = true;
            const rect = container.getBoundingClientRect();
            const t = e.touches[0];
            lassoStartX = t.clientX - rect.left;
            lassoStartY = t.clientY - rect.top;
            window._cleSelectedIds = [];
            updateCleSelectionVisuals();
            lassoDiv = document.createElement('div');
            lassoDiv.style.cssText = 'position:absolute;border:2px dashed #ef4444;background:rgba(239,68,68,0.1);pointer-events:none;z-index:50;border-radius:4px;';
            lassoDiv.style.left = lassoStartX + 'px';
            lassoDiv.style.top = lassoStartY + 'px';
            container.appendChild(lassoDiv);
        }, { passive: true });

        // === DRAG CONTROLS PANEL (hold press on panel background to move it) ===
        const _cleCtrl = document.getElementById('cle-controls');
        if (_cleCtrl) {
            let _cDrag = false, _cOx = 0, _cOy = 0;
            function _cleCtrlDown(e) {
                if (e.target.closest('button')) return;
                e.preventDefault();
                _cDrag = true;
                const r = _cleCtrl.getBoundingClientRect();
                const t = e.touches ? e.touches[0] : e;
                _cOx = t.clientX - r.left;
                _cOy = t.clientY - r.top;
            }
            function _cleCtrlMove(e) {
                if (!_cDrag) return;
                e.preventDefault();
                const t = e.touches ? e.touches[0] : e;
                const cr = container.getBoundingClientRect();
                let nx = t.clientX - cr.left - _cOx;
                let ny = t.clientY - cr.top - _cOy;
                nx = Math.max(2, Math.min(cr.width - _cleCtrl.offsetWidth - 2, nx));
                ny = Math.max(2, Math.min(cr.height - _cleCtrl.offsetHeight - 2, ny));
                _cleCtrl.style.left = nx + 'px';
                _cleCtrl.style.top = ny + 'px';
                _cleCtrl.style.transform = 'none';
                _cleCtrl.style.bottom = 'auto';
            }
            function _cleCtrlUp() { _cDrag = false; }
            _cleCtrl.addEventListener('mousedown', _cleCtrlDown);
            document.addEventListener('mousemove', _cleCtrlMove);
            document.addEventListener('mouseup', _cleCtrlUp);
            _cleCtrl.addEventListener('touchstart', _cleCtrlDown, { passive: false });
            document.addEventListener('touchmove', _cleCtrlMove, { passive: false });
            document.addEventListener('touchend', _cleCtrlUp);
        }

        updateCleSaveButton();
    }

    function toggleCleSelection(id) {
        const idx = window._cleSelectedIds.indexOf(id);
        if (idx >= 0) {
            window._cleSelectedIds.splice(idx, 1);
        } else {
            window._cleSelectedIds.push(id);
        }
        updateCleSelectionVisuals();
        const count = window._cleSelectedIds.length;
        document.getElementById('cle-controls').style.display = count > 0 ? '' : 'none';
        document.getElementById('cle-selected-label').textContent = count > 1 ? '\ud83c\udfaf ' + count + ' รายการ' : (count === 1 ? '\ud83c\udfaf ' + CAPTURE_ELEMENTS.find(e => e.id === window._cleSelectedIds[0])?.label : '');
    }

    function updateCleSelectionVisuals() {
        document.querySelectorAll('.cle-draggable').forEach(d => {
            const isSel = window._cleSelectedIds && window._cleSelectedIds.includes(d.dataset.id);
            d.style.outline = isSel ? '2px dashed #ef4444' : 'none';
            d.style.outlineOffset = '2px';
            d.style.boxShadow = isSel ? '0 0 8px rgba(239,68,68,0.5)' : 'none';
        });
        // Hide controls panel when nothing is selected
        const ctrl = document.getElementById('cle-controls');
        if (ctrl) ctrl.style.display = (window._cleSelectedIds && window._cleSelectedIds.length > 0) ? '' : 'none';
    }

    function selectCleElement(id) {
        window._cleSelectedIds = [id];
        updateCleSelectionVisuals();
        const el = CAPTURE_ELEMENTS.find(e => e.id === id);
        document.getElementById('cle-controls').style.display = '';
        document.getElementById('cle-selected-label').textContent = '🎯 ' + el.label;
        // Highlight selected
        document.querySelectorAll('.cle-draggable').forEach(d => {
            d.style.outline = d.dataset.id === id ? '2px dashed #ef4444' : 'none';
            d.style.outlineOffset = '2px';
        });
    }

    function cleNudge(dx, dy) {
        if (!window._cleSelectedIds || window._cleSelectedIds.length === 0) return;
        const NW = 720, NH = 1468;
        const displayW = Math.min(360, window.innerWidth - 32);
        const displayH = displayW * (NH / NW);
        const scaleX = displayW / NW;
        const scaleY = displayH / NH;
        window._cleSelectedIds.forEach(id => {
            const div = document.querySelector('.cle-draggable[data-id="' + id + '"]');
            if (!div) return;
            // Read current position from DOM (not localStorage) so nudges are cumulative
            let newLeft = parseFloat(div.style.left) + dx * scaleX;
            let newTop = parseFloat(div.style.top) + dy * scaleY;
            newLeft = Math.max(0, Math.min(displayW - 20, newLeft));
            newTop = Math.max(0, Math.min(displayH - 10, newTop));
            div.style.left = newLeft + 'px';
            div.style.top = newTop + 'px';
        });
        window._cleDirty = true;
        updateCleSaveButton();
        // Update coords display from DOM
        const firstDiv = document.querySelector('.cle-draggable[data-id="' + window._cleSelectedIds[0] + '"]');
        if (firstDiv) {
            const tplX = Math.round(parseFloat(firstDiv.style.left) / scaleX);
            const tplY = Math.round(parseFloat(firstDiv.style.top) / scaleY);
            document.getElementById('cle-coords').textContent = 'x: ' + tplX + ' y: ' + tplY + (window._cleSelectedIds.length > 1 ? ' (' + window._cleSelectedIds.length + ' items)' : '');
        }
    }

    function cleResetDefaults() {
        // Restore the LAST SAVED layout (from the save button / Firebase sync), not factory defaults
        let restore = null;
        try {
            const s = localStorage.getItem('captureLayoutSaved');
            if (s) restore = JSON.parse(s);
        } catch(e) { restore = null; }
        if (!restore) {
            // No saved layout yet — fall back to default positions
            restore = {};
            CAPTURE_ELEMENTS.forEach(el => { restore[el.id] = { x: el.defaultX, y: el.defaultY }; });
        }
        localStorage.setItem('captureLayout', JSON.stringify(restore));
        closeCaptureLayoutEditor();
        openCaptureLayoutEditor();
    }

    function updateCleSaveButton() {
        const dirty = !!window._cleDirty;
        // Save button
        const btn = document.getElementById('cle-save-btn');
        if (btn) {
            btn.disabled = !dirty;
            btn.style.pointerEvents = dirty ? 'auto' : 'none';
            btn.style.opacity = dirty ? '1' : '0.55';
            btn.style.background = dirty ? 'linear-gradient(135deg,#d4a017,#b8941f)' : 'rgba(255,255,255,0.08)';
            btn.style.border = dirty ? '1px solid #d4a017' : '1px solid rgba(255,255,255,0.1)';
            btn.style.color = dirty ? '#0c0e14' : '#94a3b8';
        }
        // Reset button — same disabled/enabled behavior as save
        const rst = document.getElementById('cle-reset-btn');
        if (rst) {
            rst.disabled = !dirty;
            rst.style.pointerEvents = dirty ? 'auto' : 'none';
            rst.style.opacity = dirty ? '1' : '0.55';
        }
    }

    function cleSaveLayout() {
        if (!window._cleDirty) return;
        const layout = getCaptureLayout();
        // Recalculate from current positions
        const NW = 720, NH = 1468;
        const displayW = Math.min(360, window.innerWidth - 32);
        const displayH = displayW * (NH / NW);
        const scaleX = displayW / NW;
        const scaleY = displayH / NH;
        document.querySelectorAll('.cle-draggable').forEach(div => {
            const id = div.dataset.id;
            layout[id] = { x: Math.round(parseFloat(div.style.left) / scaleX), y: Math.round(parseFloat(div.style.top) / scaleY) };
        });
        saveCaptureLayout(layout);
        window._cleDirty = false;
        updateCleSaveButton();
        showToggleCard('✅', 'บันทึกเลย์เอาต์แคปเจอร์', 'เลย์เอาต์ถูกบันทึกเรียบร้อยแล้ว', { silent: true });
    }

    function cleTestCapture() {
        const layout = getCaptureLayout();
        const NW = 720, NH = 1468;
        const displayW = Math.min(360, window.innerWidth - 32);
        const displayH = displayW * (NH / NW);
        const scaleX = displayW / NW;
        const scaleY = displayH / NH;
        document.querySelectorAll('.cle-draggable').forEach(div => {
            const id = div.dataset.id;
            layout[id] = { x: Math.round(parseFloat(div.style.left) / scaleX), y: Math.round(parseFloat(div.style.top) / scaleY) };
        });
        localStorage.setItem('captureLayout', JSON.stringify(layout));

        // Generate capture canvas
        createGoldPriceCanvas().then(canvas => {
            // Show preview overlay
            const overlay = document.createElement('div');
            overlay.id = 'cle-preview-overlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;';
            overlay.innerHTML = '<div style="color:#d4a017;font-weight:bold;font-size:14px;margin-bottom:8px;">📸 ตัวอย่าง Capture</div>' +
                '<canvas id="cle-preview-canvas"></canvas>' +
                '<div style="margin-top:12px;display:flex;gap:12px;">' +
                '<button onclick="document.getElementById(\'cle-preview-overlay\').remove()" style="padding:10px 24px;border-radius:12px;background:rgba(255,255,255,0.1);color:#94a3b8;font-weight:bold;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;"><i class="ph ph-x" style="font-size:18px;"></i></button>' +
                '<button onclick="cleDownloadPreview()" style="padding:10px 24px;border-radius:12px;background:linear-gradient(135deg,#d4a017,#b8941f);color:#0c0e14;font-weight:bold;display:flex;align-items:center;justify-content:center;"><i class="ph ph-download-simple" style="font-size:18px;"></i></button>' +
                '</div>';
            document.body.appendChild(overlay);

            // Draw canvas to preview element
            const previewCanvas = document.getElementById('cle-preview-canvas');
            previewCanvas.width = canvas.width;
            previewCanvas.height = canvas.height;
            previewCanvas.style.cssText = 'max-width:90vw;max-height:70vh;border:2px solid #d4a017;border-radius:12px;';
            const pCtx = previewCanvas.getContext('2d');
            pCtx.drawImage(canvas, 0, 0);

            // Store for download
            window._clePreviewCanvas = canvas;
        });
    }

    function cleDownloadPreview() {
        if (!window._clePreviewCanvas) return;
        const canvas = window._clePreviewCanvas;
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = getGoldCaptureFileName();
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToggleCard('\u2705', 'บันทึกรูปภาพ', 'บันทึกรูปภาพสำเร็จแล้ว');    }

    function closeCaptureLayoutEditor() {
        // Remove preview overlay if open
        const ov = document.getElementById('cle-preview-overlay');
        if (ov) ov.remove();
        const modal = document.getElementById('capture-layout-modal');
        if (modal) modal.remove();
        window._cleSelectedIds = [];
        // Collapse the accordion arrow
        const chevron = document.getElementById('cle-chevron');
        if (chevron) chevron.style.transform = 'rotate(0deg)';
    }
</script>
