<script>
    const manifestObj = {
        "name": "พอร์ตทองคำ",
        "short_name": "พอร์ตทองคำ",
        "display": "fullscreen",
        "start_url": window.location.href.split('?')[0],
        "background_color": "#0f172a",
        "theme_color": "#0f172a",
        "icons": [
            { "src": "https://files.catbox.moe/ztkwxc.jpg", "sizes": "192x192", "type": "image/jpeg", "purpose": "any" },
            { "src": "https://files.catbox.moe/ztkwxc.jpg", "sizes": "512x512", "type": "image/jpeg", "purpose": "any maskable" }
        ]
    };
    const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelector('#dynamic-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));
        // Init toggle UI & chart default
        setTimeout(() => { updateToggleUI(); setChartRange('24h'); }, 500);
        // Version display is managed by Firebase real-time listener (loadVersionFromFirebase)
        
        // ========== PWA Install Prompt Banner ==========
        let deferredPrompt = null;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const installDismissed = localStorage.getItem('pwa_install_dismissed');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!isStandalone && !installDismissed) {
                setTimeout(() => showInstallBanner(), 2000);
            }
        });
        
        function showInstallBanner() {
            if (document.getElementById('pwa-install-banner')) return;
            const banner = document.createElement('div');
            banner.id = 'pwa-install-banner';
            banner.innerHTML = `
                <div style="position:fixed;bottom:0;left:0;right:0;z-index:99999;background:linear-gradient(135deg,#1a1510 0%,#2a2520 100%);border-top:2px solid #d4a017;padding:16px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.5);animation:slideUp 0.4s ease;">
                    <img src="https://files.catbox.moe/ztkwxc.jpg" style="width:48px;height:48px;border-radius:12px;border:2px solid #d4a017;flex-shrink:0;" />
                    <div style="flex:1;">
                        <div style="color:#d4a017;font-weight:700;font-size:14px;">ติดตั้ง พอร์ตทองคำ</div>
                        <div style="color:#94a3b8;font-size:12px;">เพิ่มลงหน้าจอหลักเพื่อเข้าถึงได้สะดวก</div>
                    </div>
                    <button onclick="installPWA()" style="background:#d4a017;color:#000;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;">ติดตั้ง</button>
                    <button onclick="dismissInstallBanner()" style="background:transparent;color:#64748b;border:1px solid #333;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0;">✕</button>
                </div>
            `;
            document.body.appendChild(banner);
        }
        
        window.installPWA = function() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((result) => {
                if (result.outcome === 'accepted') {
                    showWarningToast('✅ ติดตั้ง app สำเร็จ!');
                }
                deferredPrompt = null;
                const b = document.getElementById('pwa-install-banner');
                if (b) b.remove();
            });
        };
        
        window.dismissInstallBanner = function() {
            localStorage.setItem('pwa_install_dismissed', '1');
            const b = document.getElementById('pwa-install-banner');
            if (b) b.remove();
        };
    });

    // ==============================
    // แชร์ + แคปเจอร์ประกาศราคาทอง
    // ==============================
    function getGoldCaptureFileName() {
        const date = (document.getElementById('gold-as-date')?.innerText || '').trim()
            .replace(/[\\/:*?"<>|\s]+/g, '-');
        const time = (document.getElementById('gold-as-time')?.innerText || '').trim()
            .replace(/[^0-9-]+/g, '-');
        return `ราคาทอง-${date || 'ล่าสุด'}-${time || 'เวลา'}.png`;
    }

    function getGoldShareText() {
        const date = document.getElementById('gold-as-date')?.innerText?.trim() || '-';
        const time = document.getElementById('gold-as-time')?.innerText?.trim() || '-';
        const barBuy = document.getElementById('gold-bar-buy')?.innerText?.trim() || '-';
        const barSell = document.getElementById('gold-bar-sell')?.innerText?.trim() || '-';
        const ornamentBuy = document.getElementById('gold-ornament-buy')?.innerText?.trim() || '-';
        const ornamentSell = document.getElementById('gold-ornament-sell')?.innerText?.trim() || '-';
        const changeToday = document.getElementById('gold-change-today')?.innerText?.trim() || '-';
        const latestChange = document.getElementById('gold-latest-change')?.innerText?.trim() || '-';
        const count = document.getElementById('gold-update-count')?.innerText?.trim()?.replace(/[^0-9]/g, '') || '-';
        // ย่อวันที่ เช่น "25 ส.ค. 69"
        const shortDate = date.replace(/(\d+)\s+(\S+)\s+(\d+)/, (m, d, mon, y) => {
            const monShort = {'มกราคม':'ม.ค.','กุมภาพันธ์':'ก.พ.','มีนาคม':'มี.ค.','เมษายน':'เม.ย.','พฤษภาคม':'พ.ค.','มิถุนายน':'มิ.ย.','กรกฎาคม':'ก.ค.','สิงหาคม':'ส.ค.','กันยายน':'ก.ย.','ตุลาคม':'ต.ค.','พฤศจิกายน':'พ.ย.','ธันวาคม':'ธ.ค.'};
            return d + ' ' + (monShort[mon] || mon) + ' ' + y.slice(-2);
        });
        return `📊 ล่าสุด  ${latestChange}\n━━━━━━━━━━━━━\n⚜️ สมาคมค้าทองคำ\n🔄 อัปเดต(ครั้งที่ ${count})\n📅 ${shortDate}\n🕐 ${time} น.\n━━━━━━━━━━━━━\n🥇 ทองแท่ง  : \nรับซื้อ    : 🟢 ${barBuy}\nขายออก : 🔴 ${barSell}\n\n💍 รูปพรรณ : \nรับซื้อ    : 🟢 ${ornamentBuy}\nขายออก : 🔴 ${ornamentSell}\n━━━━━━━━━━━━━\n📊 ล่าสุด  ${latestChange}\n📊 วันนี้    ${changeToday}\n\n(by นักเลงคีย์บอร์ด)`;
    }

    function setGoldActionButtonsDisabled(disabled) {
        document.querySelectorAll('.gold-action-btn').forEach(btn => {
            btn.disabled = disabled;
            btn.style.pointerEvents = disabled ? 'none' : 'auto';
            btn.style.opacity = disabled ? '0.55' : '1';
        });
    }

    async function shareGoldPriceCard() {
        try {
            if (!navigator.share) {
                // Browser ที่ไม่รองรับ Web Share ให้บันทึกภาพและคัดลอกข้อความแทน
                const canvas = await createGoldPriceCanvas();
                downloadGoldCanvas(canvas, getGoldCaptureFileName());
                try {
                    await navigator.clipboard.writeText(getGoldShareText());
                } catch (_) {}
                showToggleCard('\u26a0\ufe0f', 'ไม่รองรับการแชร์', 'เบราว์เซอร์นี้ไม่รองรับหน้าต่างแชร์ จึงบันทึกภาพไว้ให้แล้ว');
                return;
            }

            const canvas = await createGoldPriceCanvas();
            const blob = await canvasToBlob(canvas);
            const fileName = getGoldCaptureFileName();
            const file = new File([blob], fileName, { type: 'image/png' });
            const shareData = {
                title: 'ประกาศราคาทองคำ',
                text: getGoldShareText(),
                files: [file]
            };

            // บนมือถือจะเปิด System Share Sheet ให้เลือก LINE, Messenger,
            // WhatsApp, Facebook และแอปอื่น ๆ ที่ติดตั้งอยู่
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share(shareData);
                showToggleCard('\u2705', 'เปิดหน้าต่างแชร์แล้ว', 'เลือกแอปที่ต้องการแชร์ได้เลย');
                return;
            }

            // เครื่องที่แชร์ไฟล์ภาพไม่ได้ ให้ลองแชร์เป็นข้อความ/ลิงก์แทน
            try {
                await navigator.share({
                    title: 'ประกาศราคาทองคำ',
                    text: getGoldShareText() + '\n' + window.location.href
                });
                showToggleCard('\u2705', 'เปิดหน้าต่างแชร์แล้ว', 'เลือกแอปที่ต้องการแชร์ได้เลย');
            } catch (fallbackError) {
                if (fallbackError?.name !== 'AbortError') throw fallbackError;
            }

            // ผู้ใช้กดปิดหน้าต่างแชร์เอง ไม่ต้องแจ้งว่าเป็นข้อผิดพลาด
            if (error?.name === 'AbortError') return;
            console.error('Share error:', error);
            showToggleCard('\u274c', 'แชร์ไม่สำเร็จ', error.message || 'กรุณาเปิดเว็บผ่าน HTTPS แล้วลองใหม่');
        }

    // แปลงวันที่ DD/MM/YYYY เป็นรูปแบบภาษาไทย
function convertToThaiDate(dateStr) {
    if (!dateStr || dateStr.includes('---')) return '--/--/----';
    const parts = dateStr.split('/');
    if (parts.length !== 3) return dateStr;
    const day = parseInt(parts[0]);
    const month = parseInt(parts[1]);
    const year = parts[2];
    const thaiMonths = [
        'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 
        'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 
        'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];
    const monthName = thaiMonths[month - 1] || '';
    return `${day} ${monthName} ${year}`;
}
    // ดึงราคาทองจากเว็บโดยตรงผ่าน CORS proxy (real-time)
    async function fetchGoldPriceDirect() {
        const targetUrl = 'https://xn--42cah7d0cxcvbbb9x.com/';
        const proxies = [
            { url: 'https://api.allorigins.win/get?url=', parseJson: true },
            { url: 'https://api.codetabs.com/v1/proxy?quest=', parseJson: false }
        ];
        for (const proxy of proxies) {
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 25000);
                const resp = await fetch(proxy.url + encodeURIComponent(targetUrl), { signal: ctrl.signal });
                clearTimeout(timer);
                if (!resp.ok) continue;
                const rawText = await resp.text();
                let html = '';
                if (proxy.parseJson) {
                    try { const j = JSON.parse(rawText); html = j.contents || ''; } catch(e) { html = rawText; }
                } else { html = rawText; }
                if (!html || !html.includes('<table')) continue;

                // Parse ราคาจากตาราง
                const prices = [];
                const priceRegex = /([\d,]+\.\d{2})/g;
                const tableMatch = html.match(/<table[\s\S]*?<\/table>/i);
                const tableArea = tableMatch ? tableMatch[0] : html;
                let m;
                while ((m = priceRegex.exec(tableArea)) !== null) prices.push(m[1]);
                const dateM = html.match(/(\d{1,2}\s+[ก-๙]+\s+\d{4})/);
                const timeM = html.match(/(\d{1,2}:\d{2})\s*น\./);
                const countM = html.match(/ครั้งที่\s*(\d+)/);
                let todayChange = '0', prevChange = '0';
                const todayRow = tableMatch ? tableMatch[0].match(/วันนี้[\s\S]*?<\/tr>/i) : null;
                if (todayRow) {
                    const rowText = todayRow[0].replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                    const nums = rowText.match(/[\-]?[\d,]+/g);
                    if (nums && nums.length >= 2) { todayChange = nums[0].replace(/,/g, ''); prevChange = nums[1].replace(/,/g, ''); }
                    else if (nums && nums.length === 1) { todayChange = nums[0].replace(/,/g, ''); }
                }
                if (todayChange === '0' && prevChange === '0') {
                    const textOnly = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
                    const tm = textOnly.match(/วันนี้\s*[◆◇●○□■▲▼🟢🔴]*\s*([\-]?\s*[\d,]+)/);
                    if (tm) todayChange = tm[1].replace(/[\s,]/g, '');
                    const lm = textOnly.match(/ล่าสุด\s*[◆◇●○□■▲▼🟢🔴]*\s*([\-]?\s*[\d,]+)/);
                    if (lm && parseInt(lm[1].replace(/[\s,]/g, '')) > 0) prevChange = lm[1].replace(/[\s,]/g, '');
                }
                console.log('✅ scrape สำเร็จจาก proxy:', proxy.url.substring(0,30), 'ครั้งที่', countM ? countM[1] : '?');
                return {
                    status: 'success',
                    bar_buy: prices[0] || '-', bar_sell: prices[1] || '-',
                    ornament_buy: prices[2] || '-', ornament_sell: prices[3] || '-',
                    date: dateM ? dateM[1] : '', time: timeM ? timeM[1] : '',
                    count: countM ? countM[1] : '0',
                    change: todayChange, prev_change: prevChange
                };
            } catch (e) {
                console.warn('Proxy failed:', proxy.url.substring(0,30), e.message);
                continue;
            }
        }
        return null;
    }

    // ฟังก์ชันเดิมดึงค่าเปลี่ยนแปลงจาก CORS proxy — ไม่ใช้แล้ว (คำนวณจาก allHistoryData แทน)

    // สร้างลูกศรเปลี่ยนแปลง: ▲ สีเขียวข้างบน ▼ สีแดงข้างล่าง (แนวตั ง)
    function buildChangeArrow(val) {
        if (val > 0) return '<span style="color: #22c55e;">▲</span>';
        if (val < 0) return '<span style="color: #ff3333;">▼</span>';
        return '<span style="display:inline-flex;flex-direction:column;line-height:0.75;letter-spacing:-2px;vertical-align:middle;"><span style="color:#22c55e;">▲</span><span style="color:#ff3333;">▼</span></span>';

        if (val > 0) return '<span style="color: #fff; font-size: 18px;">▲</span>';
        if (val < 0) return '<span style="color: #fff; font-size: 18px;">▼</span>';
        return '<span style="color:#fff; font-size: 18px;">-</span>';
    }
    
    function updateChangeDisplay(changeVal, elemId) {
        const elem = document.getElementById(elemId);
        if (elem) {
            const arrow = buildChangeArrow(changeVal);
            elem.innerHTML = `<span style="margin-right:4px;">${arrow}</span>${Math.abs(changeVal).toLocaleString()}`;

    // ===== คำนวณ "เปลี่ยนแปลงวันนี้" จาก allHistoryData =====
    // = barBuy ล่าสุดวันนี้ - barBuy ล่าสุดเมื่อวาน
    function calculateDailyChange() {
        if (!allHistoryData || allHistoryData.length === 0) return null;
        // จัดกลุ่มตามวันที่
        const dayLatest = {};
        allHistoryData.forEach(h => {
            if (!h.date || !h.barBuy) return;
            if (!dayLatest[h.date] || (h.time || '') > (dayLatest[h.date].time || '')) {
                dayLatest[h.date] = h;
            }
        });
        // เรียงวันที่จากล่าสุดไปเก่าสุด
        const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
        const sortedDates = Object.keys(dayLatest).sort((a, b) => {
            const parseD = (s) => {
                const p = s.trim().split(/\s+/);
                if (p.length < 3) return 0;
                const day = parseInt(p[0]) || 0;
                const mIdx = thaiMonths.indexOf(p[1]);
                const yr = parseInt(p[2]) || 0;
                return (yr * 10000) + ((mIdx + 1) * 100) + day;
            };
            return parseD(b) - parseD(a);
        });
        if (sortedDates.length < 2) return null;
        const todayKey = sortedDates[0];
        const yesterdayKey = sortedDates[1];
        const todayBarBuy = dayLatest[todayKey].barBuy || 0;
        const yesterdayBarBuy = dayLatest[yesterdayKey].barBuy || 0;
        if (todayBarBuy === 0 || yesterdayBarBuy === 0) return null;
        return todayBarBuy - yesterdayBarBuy;
    }

    // ===== อัปเดตแสดงผล "เปลี่ยนแปลงวันนี้" + "เปลี่ยนแปลงล่าสุด" =====
    let _lastDailyChange = null, _lastLatestChange = null;

    function updateChangeDisplays() {
        const changeElem = document.getElementById('gold-change-today');
        const latestElem = document.getElementById('gold-latest-change');
        // ถ้ายังไม่ได้รับค่าจาก GAS API ให้แสดง '-' ก่อน
        if (!_gasApiResponded) {
            if (changeElem) changeElem.innerHTML = '-';
            if (latestElem) latestElem.innerHTML = '-';
            return;
        }
        // คำนวณจาก allHistoryData ก่อนเสมอ
        let dailyChange = 0, latestChange = 0;
        if (allHistoryData && allHistoryData.length >= 2) {
            const sorted = [...allHistoryData].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            // เปลี่ยนแปลงล่าสุด = 2 record ล่าสุด
            latestChange = (sorted[0].barBuy || 0) - (sorted[1].barBuy || 0);
            // เปลี่ยนแปลงวันนี้ = ล่าสุดวันนี้ - ล่าสุดเมื่อวาน
            const thaiMonths = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
            const parseD = (s) => { const p = s.trim().split(/\s+/); if (p.length < 3) return 0; return (parseInt(p[2])||0)*10000 + ((thaiMonths.indexOf(p[1])+1)*100) + (parseInt(p[0])||0); };
            const dayLatest = {};
            allHistoryData.forEach(h => {
                if (!h.date || !h.barBuy) return;
                if (!dayLatest[h.date] || (h.time || '') > (dayLatest[h.date].time || '')) dayLatest[h.date] = h;
            });
            const sortedDates = Object.keys(dayLatest).sort((a, b) => parseD(b) - parseD(a));
            if (sortedDates.length >= 2) {
                dailyChange = (dayLatest[sortedDates[0]].barBuy || 0) - (dayLatest[sortedDates[1]].barBuy || 0);
            }
        }
        // ใช้ค่าจาก GAS API ถ้ามี (จะแม่นกว่า)
        if (_goldChangeToday !== 0) dailyChange = _goldChangeToday;
        if (_goldLatestChange !== 0) latestChange = _goldLatestChange;

        if (changeElem && dailyChange !== 0) {
            const dcBg = dailyChange > 0 ? '#16a34a' : '#dc2626';
            changeElem.innerHTML = `<div style="display:flex;justify-content:center;"><span style="display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:999px;font-size:18px;font-weight:800;color:#fff;background:${dcBg};line-height:1;">${buildChangeArrowWhite(dailyChange)} ${Math.abs(dailyChange).toLocaleString()}</span></div>`;
            changeElem.className = "gold-stat-value";
        }
        if (latestElem && latestChange !== 0) {
            const lcBg = latestChange > 0 ? '#16a34a' : '#dc2626';
            latestElem.innerHTML = `<div style="display:flex;justify-content:center;"><span style="display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:999px;font-size:18px;font-weight:800;color:#fff;background:${lcBg};line-height:1;">${buildChangeArrowWhite(latestChange)} ${Math.abs(latestChange).toLocaleString()}</span></div>`;

        }
    }

    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPriceChangeSound() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioContext();
            // สร้างเสียง beep 2 ครั้ง พร้อมกัน ( pleasant chime)
            [523.25, 659.25].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
                osc.start(ctx.currentTime + i * 0.15);
                osc.stop(ctx.currentTime + i * 0.15 + 0.4);
            });
        } catch(e) { console.warn('Sound play error:', e); }
    }

    function playLoginSound() {
        if (!soundEnabled) return;
        try {
            const ctx = getAudioContext();
            // เสียง login: 3 โน้ต ascending (C5-E5-G5)
            [523.25, 659.25, 783.99].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.35);
                osc.start(ctx.currentTime + i * 0.12);
                osc.stop(ctx.currentTime + i * 0.12 + 0.35);
            });
        } catch(e) { console.warn('Login sound error:', e); }
    }

    // === Text-to-Speech แจ้งเตือนราคาทองด้วยเสียงพูด ===
    function speakPriceChange(count, latestChange, barBuy) {
        if (!voiceEnabled || !('speechSynthesis' in window)) return;
        try {
            window.speechSynthesis.cancel();
            let text = '';
            if (count) text += `อัปเดตครั้งที่ ${count} `;
            if (latestChange > 0) text += `เปลี่ยนแปลงล่าสุด บวก ${latestChange} บาท`;
            else if (latestChange < 0) text += `เปลี่ยนแปลงล่าสุด ลบ ${Math.abs(latestChange)} บาท`;
            else text += `ราคาทองคำไม่เปลี่ยนแปลง`;
            if (barBuy) text += ` ทองคำแท่งรับซื้อ ปัจจุบัน ${barBuy} บาท`;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'th-TH';
            utter.rate = 1.1;
            utter.pitch = 1.0;
            utter.volume = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const thVoice = voices.find(v => v.lang.startsWith('th'));
            if (thVoice) utter.voice = thVoice;
            window.speechSynthesis.speak(utter);
        } catch(e) { console.warn('TTS error:', e); }
    }

    function cleanupOldHistory() {
        if (!db) return;
        const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000);
        db.ref('gold_price_history').orderByChild('timestamp').endAt(cutoff).once('value', snap => {
            const updates = {};

        });

    // ===== Auto-dedup: ลบ record ซ้ำอัตโนมัติ =====
    let lastDedupTime = 0;
    const DEDUP_INTERVAL = 60000; // เช็คทุก 1 นาที
    let _normalizeDone = false; // run leading-zero cleanup only until done
    let _dedupDone = false; // run dedup only once on first load
    function autoDedupHistory() {
        if (!db || !allHistoryData || allHistoryData.length < 2) return;
        if (_dedupDone && _normalizeDone) return; // all cleanup done
        const now = Date.now();
        if (now - lastDedupTime < DEDUP_INTERVAL) return;
        lastDedupTime = now;

        // จัดกลุ่ม record ตาม date+time+barBuy (normalize leading zero in day)
        const groups = {};
        allHistoryData.forEach(h => {
            const normDate = h.date ? h.date.replace(/^(\d+)/, m => parseInt(m, 10).toString()) : h.date;
            const key = `${normDate}_${h.time}_${h.barBuy}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(h);
        });

        // หา record ที่ซ้ำกัน
        const keysToDelete = [];
        Object.values(groups).forEach(group => {
            if (group.length > 1) {
                // เรียงตาม timestamp ใหม่สุดก่อน แล้วลบตัวที่เก่ากว่า
                group.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                for (let i = 1; i < group.length; i++) {
                    keysToDelete.push(group[i].id);
                }
            }
        });

        if (keysToDelete.length > 0) {
            const updates = {};
            keysToDelete.forEach(k => { updates[k] = null; });
            db.ref('gold_price_history').update(updates).then(() => {
                console.log('Auto-dedup: removed ' + keysToDelete.length + ' duplicate records');
            });
        }
        _dedupDone = true;

        // Normalize leading-zero dates in memory (display only)
        allHistoryData.forEach(h => {
            if (!h.date) return;
            const normDate = h.date.replace(/^(\d+)/, m => parseInt(m, 10).toString());
            if (normDate !== h.date) h.date = normDate;
        });
    }

    function showMonthPicker() {
        const modal = document.getElementById('month-picker-modal');
        const list = document.getElementById('month-picker-list');
        if (!modal || !list) return;

        // Build list of available months from allHistoryData
        const months = {};
        if (allHistoryData && allHistoryData.length > 0) {
            allHistoryData.forEach(h => {
                if (!h.date) return;
                const parts = h.date.trim().split(' ');
                if (parts.length < 3) return;
                const monthName = parts[1];
                const year = parseInt(parts[2]) || 0;
                const monthIdx = thaiMonths.indexOf(monthName);
                if (monthIdx === -1) return;
                const key = `${year}_${monthIdx}`;
                if (!months[key]) months[key] = { month: monthIdx, year: year, name: monthName };
            });
        }

        // Sort newest first
        const sorted = Object.values(months).sort((a, b) => {
            if (b.year !== a.year) return b.year - a.year;
            return b.month - a.month;
        });

        let html = '';
        sorted.forEach(m => {
            const isSelected = selectedMonth && selectedMonth.month === m.month && selectedMonth.year === m.year;
            const bg = isSelected ? 'var(--accent-gold)' : 'var(--bg-elevated)';
            const color = isSelected ? '#0c0e14' : 'var(--text-secondary)';
            const border = isSelected ? 'none' : '1px solid var(--border-primary)';
            html += `<button onclick="selectMonth(${m.month}, ${m.year}, '${m.name}')" class="text-[11px] px-2 py-1.5 rounded-lg font-bold transition cursor-pointer" style="background: ${bg}; color: ${color}; border: ${border};">${m.name} ${m.year}</button>`;
        });
        list.innerHTML = html;
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
    }

    function selectMonth(monthIdx, year, name) {

        // Update button styles

    function parseThaiDate(dateStr, timeStr) {
        // Parse '21 สิงหาคม 2569' and '16:45' into comparable number
        if (!dateStr) return 0;
        const parts = dateStr.trim().split(' ');
        if (parts.length < 3) return 0;
        const day = parseInt(parts[0]) || 0;
        const monthName = parts[1];
        const year = parseInt(parts[2]) || 0;
        const monthIdx = thaiMonths.indexOf(monthName);
        if (monthIdx === -1) return 0;
        const [h, m] = (timeStr || '00:00').split(':').map(Number);
        // Sort key: year*100000000 + month*1000000 + day*10000 + hour*100 + min
        return year * 100000000 + (monthIdx + 1) * 1000000 + day * 10000 + (h || 0) * 100 + (m || 0);
    }

    function getFilteredHistory() {
        if (!allHistoryData) return [];
        let filtered = [...allHistoryData];

        // Use 'date' string field for filtering (more reliable than timestamp)
        const filterNow = new Date();
        const todayStr = `${filterNow.getDate()} ${thaiMonths[filterNow.getMonth()]} ${filterNow.getFullYear() + 543}`;
        console.log('Filter:', historyFilter, '| todayStr:', todayStr, '| records:', allHistoryData.length, '| sample dates:', allHistoryData.slice(0,3).map(d => d.date));

        if (historyFilter === 'all') {
            // ไม่กรอง — แสดงทั้งหมด
        } else if (historyFilter === 'today') {
            filtered = filtered.filter(d => d.date && d.date.trim() === todayStr.trim());
        } else if (historyFilter === 'yesterday') {
            const y = new Date(filterNow);
            y.setDate(y.getDate() - 1);
            const yesterdayStr = `${y.getDate()} ${thaiMonths[y.getMonth()]} ${y.getFullYear() + 543}`;
            filtered = filtered.filter(d => d.date && d.date.trim() === yesterdayStr.trim());
        } else if (historyFilter === 'week') {
            // Filter by date string containing current week dates (Mon-Sun)
            const weekDates = [];
            const dayOfWeek = filterNow.getDay(); // 0=Sun, 1=Mon, ...
            const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1; // days since Monday
            for (let i = -mondayOffset; i <= (6 - mondayOffset); i++) {
                const d = new Date(filterNow);
                d.setDate(d.getDate() + i);
                weekDates.push(`${d.getDate()} ${thaiMonths[d.getMonth()]} ${d.getFullYear() + 543}`);
            }
            filtered = filtered.filter(d => weekDates.some(wd => d.date && d.date.trim() === wd.trim()));
        } else if (historyFilter === 'month') {
            const monthStr = thaiMonths[filterNow.getMonth()];
            const yearStr = String(filterNow.getFullYear() + 543);
            filtered = filtered.filter(d => d.date && d.date.trim().includes(monthStr) && d.date.trim().includes(yearStr));
        } else if (historyFilter === 'selected_month' && selectedMonth) {
            const monthStr = thaiMonths[selectedMonth.month];
            const yearStr = String(selectedMonth.year);
            filtered = filtered.filter(d => d.date && d.date.trim().includes(monthStr) && d.date.trim().includes(yearStr));
        } else if (historyFilter === 'date') {
            const picked = document.getElementById('hist-date-picker').value;
            if (picked) {
                const pickDate = new Date(picked);
                const pickStr = `${pickDate.getDate()} ${thaiMonths[pickDate.getMonth()]} ${pickDate.getFullYear() + 543}`;
                filtered = filtered.filter(d => d.date && d.date.trim() === pickStr.trim());
            }
        }
        // Sort by actual date+time (newest first), not import timestamp
        filtered.sort((a, b) => parseThaiDate(b.date, b.time) - parseThaiDate(a.date, a.time));
        return filtered;
    }

    function renderHistoryList() {
        const list = document.getElementById('price-history-list');
        const countLabel = document.getElementById('hist-count-label');
        const deleteAllBtn = document.getElementById('hist-btn-delete-all');
        if (!list) return;
        const filtered = getFilteredHistory();
        if (countLabel) countLabel.textContent = `แสดง ${filtered.length} รายการ`;
        
        // แสดงปุ่มลบทั้งหมด (เฉพาะ admin และมีข้อมูล)
        if (deleteAllBtn) {
            if (currentRole === 'admin' && filtered.length > 0) {
                deleteAllBtn.classList.remove('hidden');
            } else {
                deleteAllBtn.classList.add('hidden');
            }
        }
        
        if (filtered.length === 0) {
            list.innerHTML = '<p class="text-center py-6" style="color: var(--text-muted);">ไม่มีข้อมูลในช่วงเวลาที่เลือก</p>';
            return;
        }
        
        // Group by date to find last record of each day and calculate daily change
        const dayGroups = {};
        filtered.forEach((d, i) => {
            const dateKey = d.date || 'unknown';
            if (!dayGroups[dateKey]) dayGroups[dateKey] = { records: [], latestIdx: i };
            dayGroups[dateKey].records.push(d);
        });

        // Build a map of ALL dates -> latest barBuy from allHistoryData (for previous day lookup)
        // allHistoryData เรียงจากเก่าไปใหม่ (ascending) → ใช้ timestamp เทียบเพื่อเก็บตัวใหม่สุด
        const allDayLatest = {};
        if (allHistoryData && allHistoryData.length > 0) {
            allHistoryData.forEach(h => {
                const dk = h.date || 'unknown';
                if (!allDayLatest[dk] || (h.time || '') > (allDayLatest[dk].time || '')) {
                    allDayLatest[dk] = h; // เก็บตัวใหม่สุดของแต่ละวัน
                }
            });
        }

        // For each day in filtered, find the previous day's last barBuy from allDayLatest
        const dailyChanges = {};
        const sortedDates = Object.keys(dayGroups).sort((a, b) => {
            return parseThaiDate(b, '12:00') - parseThaiDate(a, '12:00');
        });
        sortedDates.forEach((dateKey) => {
            const group = dayGroups[dateKey];
            const latestOfThisDay = group.records[0];
            // Find previous day from allDayLatest
            const allDates = Object.keys(allDayLatest).sort((a, b) => parseThaiDate(b, '12:00') - parseThaiDate(a, '12:00'));
            const currentIdx = allDates.indexOf(dateKey);
            if (currentIdx >= 0 && currentIdx < allDates.length - 1) {
                const prevDateKey = allDates[currentIdx + 1];
                const latestOfPrevDay = allDayLatest[prevDateKey];
                dailyChanges[dateKey] = {
                    change: (latestOfThisDay.barBuy || 0) - (latestOfPrevDay.barBuy || 0),
                    latestIdx: group.latestIdx
                };
            }
        });

        let html = '';
        filtered.forEach((d, i) => {
            // คำนวณการเปลี่ยนแปลงล่าสุด: barBuy ปัจจุบัน - barBuy ก่อนหน้า
            // Find previous record: first try filtered list, then search allHistoryData
            let prev = filtered[i + 1];
            if (!prev && allHistoryData && allHistoryData.length > 0) {
                // Find the last record that comes before this one chronologically
                const currentSortKey = parseThaiDate(d.date, d.time);
                let bestPrev = null;
                let bestKey = 0;
                for (const h of allHistoryData) {
                    if (h.id === d.id) continue;
                    const hKey = parseThaiDate(h.date, h.time);
                    if (hKey < currentSortKey && hKey > bestKey) {
                        bestKey = hKey;
                        bestPrev = h;
                    }
                }
                prev = bestPrev;
            }
            const priceChange = prev ? (d.barBuy || 0) - (prev.barBuy || 0) : null;
            const isUp = priceChange !== null && priceChange >= 0;
            const changeColor = '#fff';
            const arrow = priceChange === null ? '-' : (priceChange === 0 ? '-' : (isUp ? '<span style="color:#fff;">▲</span>' : '<span style="color:#fff;">▼</span>'));
            const changeBg = priceChange === null ? 'rgba(148,163,184,0.2)' : (priceChange === 0 ? 'rgba(148,163,184,0.2)' : (isUp ? '#16a34a' : '#dc2626'));
            html += `
            <div style="background: var(--bg-elevated); border: 1px solid var(--border-primary); border-radius: 12px; padding: 12px;">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold" style="color: var(--accent-gold);">#${filtered.length - i}</span>
                    <div class="flex items-center gap-2">
                        <span class="text-xs" style="color: var(--text-secondary);">${d.date || '-'} ${d.time || ''}</span>
                        ${currentRole === 'admin' ? `<button onclick="deletePriceHistory('${d.id}')" class="cursor-pointer transition bg-transparent border-none p-1" style="color: var(--accent-red); opacity: 0.6; font-size: 14px;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'"><i class="ph ph-trash"></i></button>` : ''}
                    </div>
                </div>
                <table class="w-full text-xs" style="border-collapse: collapse; table-layout: fixed;">
                    <tr><td style="color: var(--text-muted); white-space: nowrap; padding: 1px 4px 1px 0;">ทองแท่งซื้อ</td><td style="width:55%; text-align:right; padding: 1px 0 1px 4px;"><span class="font-bold" style="color: var(--accent-gold);">${(d.barBuy || 0).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></td><td style="color: var(--text-muted); white-space: nowrap; padding: 1px 4px 1px 8px;">ทองแท่งขาย</td><td style="width:55%; text-align:right; padding: 1px 0;"><span class="font-bold" style="color: var(--accent-gold);">${(d.barSell || 0).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></td></tr>
                    <tr><td style="color: var(--text-muted); white-space: nowrap; padding: 1px 4px 1px 0;">รูปพรรณซื้อ</td><td style="width:55%; text-align:right; padding: 1px 0 1px 4px;"><span class="font-bold" style="color: var(--accent-gold);">${(d.ornamentBuy || 0).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></td><td style="color: var(--text-muted); white-space: nowrap; padding: 1px 4px 1px 8px;">รูปพรรณขาย</td><td style="width:55%; text-align:right; padding: 1px 0;"><span class="font-bold" style="color: var(--accent-gold);">${(d.ornamentSell || 0).toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span></td></tr>
                </table>
                <div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-subtle);">
                    <span class="text-xs" style="color: var(--text-muted);">เปลี่ยนแปลงล่าสุด</span>
                    <span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;color:#fff;background:${changeBg};">${priceChange === null ? '-' : (priceChange === 0 ? '-' : arrow + ' ' + Math.abs(priceChange).toLocaleString())}</span>
                </div>
                ${(() => {
                    const dc = dailyChanges[d.date];
                    if (dc && dc.latestIdx === i) {
                        const dcVal = dc.change || 0;
                        const dcUp = dcVal > 0;
                        const dcZero = dcVal === 0;
                        const dcColor = '#fff';
                        const dcBg = dcZero ? 'rgba(148,163,184,0.3)' : dcUp ? '#16a34a' : '#dc2626';
                        const dcArrowHtml = buildChangeArrowWhite(dcVal);
                        return `<div class="flex items-center justify-between mt-2 pt-2" style="border-top: 1px solid var(--border-subtle);">
                            <span class="text-xs" style="color: var(--text-muted);">เปลี่ยนแปลงวันนี้</span>
                            <span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: ${dcColor}; background: ${dcBg};">${dcArrowHtml} ${dcZero ? '0' : Math.abs(dcVal).toLocaleString()}</span>
                        </div>`;
                    }
                    return '';
                })()}
            </div>`;
        });
        list.innerHTML = html;
    }

    // ===== Cleanup Duplicates Function =====
    function cleanupDuplicateHistory() {
        if (!db || !allHistoryData) return;
        
        // Group records by date+time
        const groups = {};
        allHistoryData.forEach(d => {
            const key = `${d.date}_${d.time}`;
            if (!groups[key]) groups[key] = [];
            groups[key].push(d);
        });
        
        // Find duplicates
        const duplicates = [];
        Object.values(groups).forEach(records => {
            if (records.length > 1) {
                // Keep the first one, mark rest for deletion
                records.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                for (let i = 1; i < records.length; i++) {
                    duplicates.push(records[i]);
                }
            }

    function parseImportData() {
        const textarea = document.getElementById('import-history-textarea');
        const rawData = textarea.value.trim();
        if (!rawData) {
            showWarningToast('⚠️ กรุณาวางข้อมูลก่อน!');
            return;
        }

        importParsedData = [];
        const lines = rawData.split('\n');
        let currentDate = '';
        let currentDayName = '';
        let currentChange = 0;

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            // Detect day header: "จันทร์ที่ 3 สิงหาคม 69-150" or "อาทิตย์ที่ 2 สิงหาคม 69+50"
            const dayHeaderMatch = line.match(/^(.+ที่)\s+(\d+)\s+(\S+)\s+(\d+)([+-]?\d+)$/);
            if (dayHeaderMatch) {
                currentDayName = dayHeaderMatch[1];
                const day = dayHeaderMatch[2];
                const monthThai = dayHeaderMatch[3];
                const yearBE = dayHeaderMatch[4];
                currentChange = parseInt(dayHeaderMatch[5]) || 0;
                
                // Convert to DD/MM/YYYY format
                const monthMap = {'มกราคม':'01','กุมภาพันธ์':'02','มีนาคม':'03','เมษายน':'04','พฤษภาคม':'05','มิถุนายน':'06','กรกฎาคม':'07','สิงหาคม':'08','กันยายน':'09','ตุลาคม':'10','พฤศจิกายน':'11','ธันวาคม':'12'};
                const monthNum = monthMap[monthThai] || '01';
                currentDate = `${day.padStart(2,'0')}/${monthNum}/${yearBE}`;
                return;
            }

            // Parse data row: "03/08/2569 16:45\t15\t63,850.00\t64,050.00\t62,580.48\t64,850.00\t4,055.00\t33.35\t50"
            const parts = line.split('\t');
            if (parts.length >= 6) {
                const dateTime = parts[0].trim();
                const count = parseInt(parts[1]) || 0;
                const barBuy = parseFloat(parts[2].replace(/,/g, '')) || 0;
                const barSell = parseFloat(parts[3].replace(/,/g, '')) || 0;
                const ornamentBuy = parseFloat(parts[4].replace(/,/g, '')) || 0;
                const ornamentSell = parseFloat(parts[5].replace(/,/g, '')) || 0;
                const change = parts.length > 6 ? parseFloat(parts[6].replace(/,/g, '')) || 0 : 0;

                // Parse date and time from "03/08/2569 16:45"
                const dtParts = dateTime.split(/\s+/);
                let dateStr = dtParts[0] || currentDate;
                let timeStr = dtParts[1] || '09:00';

                // Convert DD/MM/YYYY to Thai format for Firebase
                const dateComponents = dateStr.split('/');
                let thaiDate = '';
                if (dateComponents.length === 3) {
                    const day = parseInt(dateComponents[0]);
                    const month = parseInt(dateComponents[1]);
                    const yearBE = parseInt(dateComponents[2]);
                    const thaiMonthsFull = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
                    thaiDate = `${day} ${thaiMonthsFull[month - 1]} ${yearBE}`;
                }

                if (barBuy > 0) {
                    importParsedData.push({
                        date: thaiDate || currentDate,
                        time: timeStr,
                        barBuy: barBuy,
                        barSell: barSell,
                        ornamentBuy: ornamentBuy,
                        ornamentSell: ornamentSell,
                        changeToday: currentChange,
                        timestamp: 0
                    });
                }
            }
        });

        // Deduplicate: keep only one record per date+time combination
        const deduped = {};
        importParsedData.forEach(d => {
            const key = `${d.date}_${d.time}`;
            if (!deduped[key]) {
                deduped[key] = d;
            }
        });
        const removedCount = importParsedData.length - Object.keys(deduped).length;
        importParsedData = Object.values(deduped);
        if (removedCount > 0) {
            console.log(`Dedup: removed ${removedCount} duplicate records, ${importParsedData.length} remaining`);
        }

        // Data Integrity Validation
        let validationErrors = [];
        importParsedData = importParsedData.filter(d => {
            if (!d.date || d.date.includes('undefined')) { validationErrors.push('วันที่ไม่ถูกต้อง: ' + d.date); return false; }
            if (!d.time || !/\d{2}:\d{2}/.test(d.time)) { validationErrors.push('เวลาไม่ถูกต้อง: ' + d.time); return false; }
            if (d.barBuy <= 0) { validationErrors.push('ราคาทองรับซื้อ = 0 ที่ ' + d.date + ' ' + d.time); return false; }
            if (d.barSell <= 0) { validationErrors.push('ราคาทองขายออก = 0 ที่ ' + d.date + ' ' + d.time); return false; }
            if (d.barBuy > 200000 || d.barSell > 200000) { validationErrors.push('ราคาน่าจะผิดปกติ (เกิน 200,000): ' + d.date + ' ' + d.time); return false; }
            return true;
        });
        if (validationErrors.length > 0) {
            console.warn('Validation warnings:', validationErrors);
            showWarningToast(`⚠️ ตรวจพบ ${validationErrors.length} รายการที่ไม่ถูกต้อง (จะข้ามรายการเหล่านี้)`);
        }

        // Show preview
        const previewDiv = document.getElementById('import-preview');
        const previewList = document.getElementById('import-preview-list');
        const importCount = document.getElementById('import-count');
        const btnSubmit = document.getElementById('btn-submit-import');

        if (importParsedData.length === 0) {
            showWarningToast('❌ ไม่พบข้อมูลที่ถูกต้อง กรุณาตรวจสอบรูปแบบข้อมูล');
            previewDiv.classList.add('hidden');
            btnSubmit.classList.add('hidden');
            return;
        }

        importCount.textContent = importParsedData.length;
        let previewHtml = '';
        importParsedData.slice(0, 10).forEach(d => {
            previewHtml += `<div class="flex justify-between items-center py-1.5 border-b" style="border-color: var(--border-primary);">
                <span class="text-xs" style="color: var(--text-secondary);">${d.date} ${d.time}</span>
                <span class="text-xs font-bold" style="color: var(--accent-gold);">${d.barBuy.toLocaleString()}</span>
            </div>`;
        });
        if (importParsedData.length > 10) {
            previewHtml += `<p class="text-center py-2 text-xs" style="color: var(--text-muted);">... และอีก ${importParsedData.length - 10} รายการ</p>`;
        }
        previewList.innerHTML = previewHtml;
        previewDiv.classList.remove('hidden');
        btnSubmit.classList.remove('hidden');
        showWarningToast(`✅ พบข้อมูล ${importParsedData.length} รายการ พร้อมนำเข้า!`);
    }

    async function submitImportData() {
        if (importParsedData.length === 0) {
            showWarningToast('❌ ไม่มีข้อมูลให้นำเข้า!');
            return;
        }

        const btnSubmit = document.getElementById('btn-submit-import');
        const statusDiv = document.getElementById('import-status');
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '<i class="ph ph-spinner animate-spin"></i> กำลังนำเข้า...';

        let successCount = 0;
        let skipCount = 0;
        let errorCount = 0;

        for (const d of importParsedData) {
            try {
                // เช็คซ้ำโดยเทียบ date+time+barBuy กับ allHistoryData ที่โหลดมาจาก Firebase แล้ว
                const isDuplicate = allHistoryData && allHistoryData.some(h =>
                    h.date === d.date && h.time === d.time && h.barBuy === d.barBuy
                );
                if (isDuplicate) {
                    skipCount++;
                    continue;
                }

                // สร้าง key สำหรับบันทึก
                const safeDate = d.date.replace(/[\s\/]/g, '');
                const safeTime = d.time.replace(/[\s\.:น]/g, '');
                const recordKey = `IMP_${safeDate}_${safeTime}`;

                const importTimestamp = new Date(d.date.replace(/(\d+)\s+(\S+)\s+(\d+)/, function(m, day, month, year) {
                    const monthMap = {'\u0e21\u0e01\u0e23\u0e32\u0e07\u0e04\u0e4c':'0','\u0e01\u0e39\u0e49\u0e21\u0e31\u0e19\u0e23\u0e2d':'1','\u0e44\u0e21\u0e48\u0e19\u0e32\u0e07\u0e04\u0e32':'2','\u0e40\u0e21\u0e23\u0e32\u0e22\u0e2d\u0e14':'3','\u0e1e\u0e23\u0e37\u0e2d\u0e22\u0e07\u0e27\u0e32\u0e07':'4','\u0e21\u0e34\u0e40\u0e19\u0e37\u0e2d\u0e23\u0e32\u0e22':'5','\u0e01\u0e23\u0e32\u0e07\u0e25\u0e32\u0e14':'6','\u0e2a\u0e34\u0e49\u0e19\u0e32\u0e22':'7','\u0e21\u0e32\u0e23\u0e04\u0e32\u0e23\u0e13':'8','\u0e15\u0e37\u0e2d\u0e2d\u0e32\u0e25\u0e30\u0e04\u0e27\u0e19':'9','\u0e1e\u0e37\u0e30\u0e15\u0e32\u0e07\u0e25\u0e2d':'10','\u0e22\u0e1b\u0e32\u0e14\u0e23\u0e2d\u0e22':'11'};
                    return monthMap[month] + '/' + day + '/' + year;
                }) + ' ' + d.time).getTime() || Date.now();
                await db.ref('gold_price_history/' + recordKey).set({
                    barBuy: d.barBuy,
                    barSell: d.barSell,
                    ornamentBuy: d.ornamentBuy,
                    ornamentSell: d.ornamentSell,
                    changeToday: d.changeToday,
                    latestChange: 0,
                    date: d.date,
                    time: d.time,
                    count: 0,
                    timestamp: importTimestamp
                });
                // allHistoryData จะอัปเดตอัตโนมัติจาก Firebase listener
                successCount++;
            } catch (e) {
                errorCount++;
                console.error('Import error:', e);
            }
        }

        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="ph ph-cloud-arrow-up"></i> นำเข้าข้อมูล';

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = `<i class="ph ph-check-circle"></i> นำเข้าสำเร็จ! ใหม่ ${successCount} / ข้าม ${skipCount} / ผิดพลาด ${errorCount}`;
        showWarningToast(`✅ นำเข้าสำเร็จ ${successCount} รายการ!`);

        // Reload history data
        loadHistoryGlobal();
        renderHistoryList();
    }

    function thaiDateToMs(dateStr, timeStr) {
        // Convert Thai date '23 สิงหาคม 2569' + time '09:00' to JS timestamp (ms)
        if (!dateStr) return 0;
        const parts = dateStr.trim().split(' ');
        if (parts.length < 3) return 0;
        const day = parseInt(parts[0]) || 1;
        const monthIdx = thaiMonths.indexOf(parts[1]);
        if (monthIdx === -1) return 0;
        const yearBE = parseInt(parts[2]) || 2569;
        const yearCE = yearBE - 543;
        const [h, m] = (timeStr || '00:00').split(':').map(Number);
        return new Date(yearCE, monthIdx, day, h || 0, m || 0).getTime();
    }

    function renderGoldChart() {
        const canvas = document.getElementById('gold-price-chart');
        if (!canvas || !allHistoryData || allHistoryData.length === 0) return;

        // Filter data by range using actual date+time (not import timestamp)
        let filtered = [...allHistoryData];
        
        // Convert to ms timestamps for filtering
        filtered.forEach(d => { d._ms = thaiDateToMs(d.date, d.time); });
        filtered = filtered.filter(d => d._ms > 0);
        filtered.sort((a, b) => a._ms - b._ms);
        
        if (filtered.length === 0) return;
        const latestMs = filtered[filtered.length - 1]._ms;
        
        // Calculate cutoff based on range
        const rangeMs = { '1h': 3600000, '12h': 43200000, '24h': 86400000, '7d': 604800000, '30d': 2592000000 };
        if (rangeMs[chartRange]) {
            const cutoff = latestMs - rangeMs[chartRange];
            filtered = filtered.filter(d => d._ms >= cutoff);
        }

        if (filtered.length < 1) {
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#5a6178';
            ctx.font = '13px Sarabun';
            ctx.textAlign = 'center';
            const noDataText = chartRange === '1h' ? 'ยังไม่มีข้อมูลในชั่วโมงนี้ (ข้อมูลจะสะสมเมื่อราคาอัปเดต)' : 'ยังไม่มีข้อมูลเพียงพอสำหรับกราฟ';
            ctx.fillText(noDataText, canvas.width / 2, canvas.height / 2);
            return;
        }

        // Already sorted by _ms ascending

        // Prepare labels and data
        const isHourly = ['1h', '12h', '24h'].includes(chartRange);
        const thaiMonthsShort = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
        
        // Build full labels array
        const fullLabels = filtered.map(d => {
            if (isHourly) return d.time || '';
            if (d.date) {
                const parts = d.date.trim().split(' ');
                if (parts.length >= 2) {
                    const day = parts[0];
                    const monthIdx = thaiMonths.indexOf(parts[1]);
                    if (monthIdx >= 0) return day + ' ' + thaiMonthsShort[monthIdx];
                }
                return d.date;
            }
            return '';
        });
        
        // For daily ranges, pick evenly-spaced labels (first, last, and ~4-5 in between)
        // For hourly, let Chart.js auto-skip
        const targetTicks = 6;
        let labels;
        // Pick evenly-spaced labels (first, last, and ~4-5 in between)
        const picked = new Set();
        picked.add(0);
        picked.add(fullLabels.length - 1);
        if (fullLabels.length > targetTicks) {
            const step = Math.max(1, Math.floor((fullLabels.length - 1) / (targetTicks - 1)));
            for (let i = 0; i < fullLabels.length; i += step) {
                picked.add(i);
            }
        }
        labels = fullLabels.map((l, i) => picked.has(i) ? l : '');
        const prices = filtered.map(d => d.barBuy || d.price || 0);

        // Determine gradient color based on trend
        const isUp = prices[prices.length - 1] >= prices[0];
        const lineColor = isUp ? '#34d399' : '#f87171';
        const bgColor = isUp ? 'rgba(52,211,153,0.12)' : 'rgba(248,113,113,0.12)';

        // Destroy old chart
        if (goldChart) goldChart.destroy();

        const ctx = canvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, bgColor);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');

        goldChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    data: prices,
                    borderColor: lineColor,
                    backgroundColor: gradient,
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: prices.length > 20 ? 0 : 3,
                    pointBackgroundColor: lineColor,
                    pointBorderColor: lineColor,
                    pointHoverRadius: 5,
                    pointHoverBackgroundColor: '#fff',
                    pointHoverBorderColor: lineColor,
                    pointHoverBorderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: { left: 0, right: 10, top: 0, bottom: 0 } },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#161a25',
                        titleColor: '#8b92a5',
                        bodyColor: '#e8eaed',
                        borderColor: '#1e2436',
                        borderWidth: 1,
                        cornerRadius: 10,
                        padding: 10,
                        displayColors: false,
                        callbacks: {
                            label: function(ctx) { return ctx.parsed.y.toLocaleString() + ' บาท'; }
                        }
                    }
                },
                scales: {
                    x: {
                        display: true,
                        grid: { color: 'rgba(30,36,54,0.5)', drawBorder: false },
                        ticks: { color: '#5a6178', font: { size: 10 }, maxRotation: 0, autoSkip: false },
                        afterBuildTicks: function(axis) {
                            // Ensure last label is always visible by adding padding
                        }
                    },
                    y: {
                        display: true,
                        grid: { color: 'rgba(30,36,54,0.5)', drawBorder: false },
                        ticks: {
                            color: '#5a6178',
                            font: { size: 10 },
                            callback: function(val) { return val.toLocaleString(); }
                        }
                    }
                },
                interaction: { intersect: false, mode: 'index' }
            }
        });
    }

    // อัปโหลดภาพไป Telegraph (Telegram, ฟรี, รองรับ CORS)
    async function uploadImageToHosting(canvas) {
        let sendBlob = await canvasToBlob(canvas);
        if (sendBlob.size > 5000000) {
            sendBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.7));
        }
        const formData = new FormData();
        formData.append('file', sendBlob, 'gold-price.png');
        const resp = await fetch('https://telegra.ph/upload', { method: 'POST', body: formData });

    // ตรวจสอบว่า error เกี่ยวกับ quota หรือไม่
    function isQuotaError(msg) {
        if (!msg) return false;
        const lower = msg.toLowerCase();
        const quotaKeywords = ['urlfetch', 'exceeded', 'quota', 'limit', 'too many', 'rate', 'throttl', 'service invoked', 'daily'];
        return quotaKeywords.some(kw => lower.includes(kw));
    }
    // ตรวจสอบว่า error เกี่ยวกับ token หรือ LINE หรือไม่
    function isTokenError(msg) {
        if (!msg) return false;
        const lower = msg.toLowerCase();
        const tokenKeywords = ['token', 'unauthorized', 'invalid', '401', '403', 'expired', 'line'];
        return tokenKeywords.some(kw => lower.includes(kw));
    }
    async function sendLineMessage(text) {
        const validUrls = GAS_API_URLS.filter(u => u && u.length > 10);
        let lastError = null;
        for (let i = 0; i < validUrls.length; i++) {
            const url = validUrls[i];
            try {
                console.log(`📤 ส่ง LINE ผ่าน GAS Account ${i + 1}...`);
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 15000);
                const resp = await fetch(url, {
                    method: 'POST',
                    redirect: 'follow',
                    signal: ctrl.signal,
                    body: JSON.stringify({
                        token: lineChannelToken,
                        broadcast: true,
                        message: text
                    })
                });
                clearTimeout(timer);
                const rawText = await resp.text();
                console.log(`📥 GAS ${i + 1} response:`, rawText.substring(0, 200));
                let data;
                try { data = JSON.parse(rawText); } catch(e) {
                    console.warn(`GAS ${i + 1} คืน non-JSON:`, rawText.substring(0, 100));
                    lastError = new Error('GAS ' + (i+1) + ' คืนข้อมูลผิดรูปแบบ');
                    continue;
                }
                if (data.status === 'success') {
                    console.log(`✅ ส่ง LINE สำเร็จจาก GAS ${i + 1}`);
                    localStorage.setItem('gasLastSuccess', String(i));
                    return;
                }
                // ตรวจ quota error หลายรูปแบบ
                // GAS คืน error ในรูปแบบ: { status: 'error', statusCode: 4xx, lineResponse: { message: '...' } }
                // หรือ: { status: 'error', message: '...' }
                const errMsg = data.message || data.error || (data.lineResponse && data.lineResponse.message) || '';
                const httpStatus = data.statusCode || resp.status;
                console.log(`📥 GAS ${i + 1} สถานะ: ${data.status}, HTTP: ${httpStatus}, error: ${errMsg}`);
                if (isQuotaError(errMsg)) {
                    console.warn(`⚠️ GAS ${i + 1} quota หมด: ${errMsg} → ลองตัวถัดไป...`);
                    lastError = new Error('GAS ' + (i+1) + ' quota หมด: ' + errMsg);
                    continue;
                }
                // ตรวจ token error — ไม่ต้องลองตัวถัดไป เพราะ GAS ตัวอื่นก็ใช้ token เดียวกัน
                if (isTokenError(errMsg) || httpStatus === 401 || httpStatus === 403) {
                    console.error(`❌ GAS ${i + 1} token/permission error: ${errMsg} (HTTP ${httpStatus})`);
                    throw new Error('❌ LINE Token ผิด/หมดอายุ/ไม่มีสิทธิ์: ' + errMsg + ' (HTTP ' + httpStatus + ')');
                }
                // ตรวจ LINE broadcast quota (monthly limit)
                if (errMsg.includes('broadcast') || errMsg.includes('monthly') || httpStatus === 429) {
                    console.error(`❌ GAS ${i + 1} LINE broadcast quota หมด: ${errMsg}`);
                    throw new Error('❌ LINE broadcast quota หมด (จำกัด 200 messages/เดือนสำหรับ Free tier): ' + errMsg);
                }
                lastError = new Error((errMsg ? errMsg + ' ' : '') + '(GAS ' + (i+1) + ', HTTP ' + httpStatus + ')');
            } catch(e) {
                if (e.message && e.message.includes('LINE Token')) throw e; // token error ส่งต่อเลย
                console.warn(`GAS ${i + 1} error:`, e.message);
                lastError = e;
                continue;
            }
        }
        throw lastError || new Error('GAS ทั้ง ' + validUrls.length + ' ตัวไม่ตอบ');
    }

    function getHistorySortWeight(dateStr, timeStr) {
        let dParts = dateStr ? dateStr.trim().split(/\s+/) : [];
        let dateVal = 0;
        if (dParts.length >= 3) {
            let day = parseInt(dParts[0]) || 0;
            let month = thaiMonths.indexOf(dParts[1]) + 1;
            let year = parseInt(dParts[2]) || 0;
            dateVal = (year * 10000) + (month * 100) + day;
        }
        let tParts = timeStr ? timeStr.replace(/[^0-9:]/g, '').split(':') : [];
        let h = parseInt(tParts[0]) || 0;
        let m = parseInt(tParts[1]) || 0;
        let s = parseInt(tParts[2]) || 0;
        let timeVal = (h * 10000) + (m * 100) + s;
        return (dateVal * 1000000) + timeVal;
    }

    function convertThaiDateToStandard(thaiDateStr) {
        if (!thaiDateStr) return '';
        let parts = thaiDateStr.trim().split(/\s+/);
        if (parts.length < 3) return '';
        let day = parseInt(parts[0]).toString().padStart(2, '0');
        let monthIdx = thaiMonths.indexOf(parts[1]);
        if (monthIdx === -1) return '';
        let month = (monthIdx + 1).toString().padStart(2, '0');
        let year = parseInt(parts[2]) - 543;
        return `${year}-${month}-${day}`;
    }

    function convertStandardToThaiDate(stdDateStr) {
        if (!stdDateStr) return '';
        let parts = stdDateStr.split('-');
        if (parts.length < 3) return '';
        let year = parseInt(parts[0]) + 543;
        let month = thaiMonths[parseInt(parts[1]) - 1];
        let day = parseInt(parts[2]).toString();
        return `${day} ${month} ${year}`;
    }

    function getLatestValidDate() {
        if (allHistoryData.length === 0) return systemTodayStr;
        let displayData = [...allHistoryData].sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        for (let item of displayData) {
            if (item.barBuy > 0 && item.barSell > 0 && item.ornamentBuy > 0 && item.ornamentSell > 0) {
                return item.date;
            }
        }
        return systemTodayStr;
    }

    // ฟังก์ชันใหม่! สร้างข้อมูลประวัติที่ถูกกรองความซ้ำซ้อนแล้วเรียบร้อย
    function getProcessedHistoryData() {
        // 1. เรียงข้อมูลจากล่าสุดไปเก่าสุด
        let displayData = [...allHistoryData].sort((a, b) => {
            let weightDiff = getHistorySortWeight(b.date, b.time) - getHistorySortWeight(a.date, a.time);
            if (weightDiff === 0) return (b.timestamp || 0) - (a.timestamp || 0);
            return weightDiff;
        });

        let uniqueData = [];
        let seen = new Set();
        
        displayData.forEach(item => {
            if (item.barBuy > 0 && item.barSell > 0 && item.ornamentBuy > 0 && item.ornamentSell > 0) {
                let cleanDate = (item.date || "").replace(/\s+/g, ' ').trim();
                let timeMatch = (item.time || "").match(/(\d{1,2}):(\d{2})/);
                let cleanTime = "";
                if (timeMatch) {
                    let h = timeMatch[1].padStart(2, '0');
                    let m = timeMatch[2];
                    cleanTime = `${h}:${m}`;
                } else {
                    cleanTime = (item.time || "").trim();
                }
                
                let key = cleanDate + "_" + cleanTime;
                if(!seen.has(key)) {
                    seen.add(key);
                    uniqueData.push({
                        ...item,
                        cleanDate: cleanDate,
                        displayTime: cleanTime
                    });
                }
            }
        });

        // 2. คำนวณส่วนต่าง (diff)
        uniqueData.forEach((item, index) => {
            if (index < uniqueData.length - 1) {
                let prevRecord = uniqueData[index + 1];
                item.diff = item.barBuy - prevRecord.barBuy; 
            } else {
                item.diff = null;
            }
        });

        return uniqueData;
    }

    // Touch swipe + mouse drag for analytics tabs
    (function() {
        const tabScroll = document.querySelector('.analytics-tab-scroll');
        if (!tabScroll) return;
        let startX = 0, scrollStart = 0, isDragging = false;
        const maxScroll = () => tabScroll.scrollWidth - tabScroll.clientWidth;
        const clamp = (v) => Math.max(0, Math.min(v, maxScroll()));
        // Touch events
        tabScroll.addEventListener('touchstart', function(e) {
            isDragging = true;
            startX = e.touches[0].pageX;
            scrollStart = tabScroll.scrollLeft;
        }, { passive: true });
        tabScroll.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            const x = e.touches[0].pageX;
            const walk = (startX - x) * 1.2;
            tabScroll.scrollLeft = clamp(scrollStart + walk);
        }, { passive: true });
        tabScroll.addEventListener('touchend', function() { isDragging = false; }, { passive: true });
        // Mouse drag for desktop
        tabScroll.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.pageX;
            scrollStart = tabScroll.scrollLeft;
            tabScroll.classList.add('dragging');
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const x = e.pageX;
            const walk = (startX - x) * 1.2;
            tabScroll.scrollLeft = clamp(scrollStart + walk);
        });
        document.addEventListener('mouseup', function() { isDragging = false; tabScroll.classList.remove('dragging'); });
        // Scroll wheel
        tabScroll.addEventListener('wheel', function(e) {
            e.preventDefault();
            tabScroll.scrollLeft = clamp(tabScroll.scrollLeft + e.deltaY + e.deltaX);
        }, { passive: false });
    })();

    // ===== SHA-256 Password Hashing =====
    async function hashPassword(password) {
        var encoder = new TextEncoder();
        var data = encoder.encode(password);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function checkPinLogin() { 
        if(Date.now() < adminPinBanUntil) return;
        
        if (currentPinInput === adminPin) { 
            db.ref('admin_settings').update({pinAttempts: 0, pinBanUntil: 0});
            adminPinAttempts = 0; adminPinBanUntil = 0;
            currentRole = 'admin'; currentUser = { username: 'admin', name: adminDisplayName, role: 'admin' }; localStorage.setItem('goldAppSession', JSON.stringify(currentUser)); closeLoginModal(); updateUIRole(); renderData(); setupPresence('admin'); logUserLogin('admin'); playLoginSound(); setupAdminNotifListener(); loadPinEnabledSetting(); if(db) { db.ref('admin_settings/theme').once('value', function(snap) { var t = snap.val() || 'dark'; localStorage.setItem('theme', t); setTheme(t); }); } 
        } else { 
            adminPinAttempts++;
            if(adminPinAttempts >= 3) {
                let banTime = Date.now() + (_pinBanHours * 3600000);
                db.ref('admin_settings').update({pinAttempts: 0, pinBanUntil: banTime});
                adminPinAttempts = 0;
                adminPinBanUntil = banTime;
                checkPinBanStatus();
            } else {
                document.getElementById('login-error').innerText = `รหัส PIN ไม่ถูกต้อง! (ผิดได้อีก ${3 - adminPinAttempts} ครั้ง)`; 
                document.getElementById('login-error').classList.remove('hidden'); 
                currentPinInput = ''; updatePinUI(); 
                if (navigator.vibrate) navigator.vibrate(200); 
            }
        } 
    }

    async function saveNewPassword() {
        const oldPass = document.getElementById('pf_old_pass').value;
        const newPass = document.getElementById('pf_new_pass').value;
        const confirmPass = document.getElementById('pf_confirm_pass').value;
        const errEl = document.getElementById('pf-pass-error');
        errEl.classList.add('hidden');
        if (!currentUser || !db) return;
        const hashedOld = await hashPassword(oldPass);
        const userData = appUsers[currentUser.username];
        if (!userData || (userData.password !== oldPass && userData.password !== hashedOld)) {
            errEl.innerHTML = '❌ รหัสผ่านเดิมไม่ถูกต้อง';
            errEl.classList.remove('hidden');
            return;
        }
        // Validate new password
        if (!/^[\x21-\x7E]{8}$/.test(newPass)) {
            errEl.innerHTML = '❌ รหัสผ่านใหม่ต้องมี 8 หลัก (อังกฤษ/ตัวเลข/สัญลักษณ์)';
            errEl.classList.remove('hidden');
            return;
        }
        if (newPass !== confirmPass) {
            errEl.innerHTML = '❌ รหัสผ่านใหม่ไม่ตรงกัน';
            errEl.classList.remove('hidden');
            return;
        }
        const hashedNew = await hashPassword(newPass);
        db.ref('app_users/' + currentUser.username + '/password').set(hashedNew).then(() => {
            showWarningToast('เปลี่ยนรหัสผ่านสำเร็จ!');

    async function getPublicIP() {
        try {
            const resp = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) });

            return data.ip || 'N/A';

    async function logUserLogin(username) {
        if (!db) return;
        // ตรวจสอบว่า user ยังมีอยู่จริงไหม ก่อนเขียน lastLogin
        const userSnap = await db.ref('app_users/' + username).once('value');
        if (!userSnap.exists()) {
            console.warn('logUserLogin: user', username, 'does not exist in Firebase, skipping lastLogin write');
            return;
        }
        const now = new Date();
        const ip = await getPublicIP();
        const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
        const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
        const entry = { type: 'login', date: dateStr, time: timeStr, ip: ip, timestamp: Date.now() };
        // Write directly via Firebase SDK push
        const ref = db.ref('user_logins/' + username).push();
        ref.set(entry);
        db.ref('app_users/' + username + '/lastLogin').set({ date: dateStr, time: timeStr, ip: ip, timestamp: Date.now() });
    }

    let _loginTimestamp = null;

    function setupPresence(username) {
        if (!db || !username) return;
        _presenceUsername = username;
        _loginTimestamp = Date.now();
        const userStatusRef = db.ref('user_presence/' + username);
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().set({ online: false, lastSeen: Date.now() });
                userStatusRef.set({ online: true, lastSeen: Date.now() });
            }
        });
        // Real-time ban check: kick user out immediately if banned
        db.ref('app_users/' + username + '/isBanned').on('value', (snap) => {
            if (snap.val() === true && currentRole !== 'admin') {
                localStorage.removeItem('goldAppSession');
                showWarningToast('🚫 บัญชีของคุณถูกแบน! จะออกจากระบบอัตโนมัติ');

            }
        });
        function saveLogoutEvent() {
            if (!_presenceUsername) return;
            localStorage.setItem('goldAppLastSeen', String(Date.now()));
            const duration = Math.round((Date.now() - _loginTimestamp) / 60000);
            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH');
            const timeStr = now.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'});
            // Use sendBeacon with Firebase REST API for reliable write on page close
            const firebaseUrl = 'https://gold-portfolio-db-default-rtdb.asia-southeast1.firebasedatabase.app';
            const logoutData = JSON.stringify({ type: 'logout', date: dateStr, time: timeStr, timestamp: Date.now(), duration: duration });
            try {
                // Write to user_logins via push (REST needs push name)
                const pushName = db.ref('user_logins/' + _presenceUsername).push().key;
                navigator.sendBeacon(firebaseUrl + '/user_logins/' + _presenceUsername + '/' + pushName + '.json', logoutData);
                // Write to user_presence
                navigator.sendBeacon(firebaseUrl + '/user_presence/' + _presenceUsername + '.json', JSON.stringify({ online: false, lastSeen: Date.now() }));
                // Write admin notification for offline
                if (currentRole !== 'admin' && appUsers && appUsers[_presenceUsername]) {
                    const notifData = JSON.stringify({ username: _presenceUsername, name: appUsers[_presenceUsername].name, ip: 'N/A', type: 'offline', duration: duration, time: timeStr, date: dateStr, timestamp: Date.now() });
                    const notifKey = db.ref('admin_notifications').push().key;
                    navigator.sendBeacon(firebaseUrl + '/admin_notifications/' + notifKey + '.json', notifData);
                }
            } catch(e) {
                db.ref('user_presence/' + _presenceUsername).set({ online: false, lastSeen: Date.now() });
                db.ref('user_logins/' + _presenceUsername).push({ type: 'logout', date: dateStr, time: timeStr, timestamp: Date.now(), duration: duration });
                if (currentRole !== 'admin') notifyAdminOffline(_presenceUsername);
            }
        }
        // Detect tab close / navigate away (only save timestamp, don't logout)
        window.addEventListener('beforeunload', function() {
            if (!_presenceUsername) return;
            localStorage.setItem('goldAppLastSeen', String(Date.now()));
        });

        db.ref('user_presence/' + username).on('value', (snap) => {
            const data = snap.val();
            if (data && data.online === false && currentRole === 'admin' && username !== 'admin') {
                const duration = data.lastSeen && _loginTimestamp ? Math.round((data.lastSeen - _loginTimestamp) / 60000) : 0;
                showAdminLoginAlert({ username: username, name: appUsers[username] ? appUsers[username].name : username, type: 'offline', ip: 'N/A', time: new Date().toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'}), duration: duration });
            }
        });
    }

    let _prevOnlineState = {};

    function setupOnlineStatusListener() {
        if (!db) return;
        db.ref('user_presence').on('value', (snap) => {
            const newPresence = snap.val() || {};
            // Detect status changes and show notifications (skip first load)
            if (currentRole === 'admin' && !_skipPresenceNotif) {
                Object.keys(newPresence).forEach(username => {
                    if (username === 'admin') return;
                    const isNowOnline = newPresence[username] && newPresence[username].online === true;
                    const wasOnline = _prevOnlineState[username];
                    if (wasOnline !== isNowOnline && appUsers && appUsers[username]) {
                        if (!isNowOnline) {
                            // Offline notification
                            const duration = newPresence[username].lastSeen ? Math.round((Date.now() - newPresence[username].lastSeen) / 60000) : 0;
                            showAdminLoginAlert({
                                username: username, name: appUsers[username].name, type: 'offline',
                                ip: 'N/A', duration: duration,
                                time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                            });
                        } else {
                            // Online notification — check if user was offline > 30 sec (skip quick refresh)
                            var lastSeenTs = newPresence[username] && newPresence[username].lastSeen;
                            var offMs = lastSeenTs ? Date.now() - lastSeenTs : 0;
                            if (offMs > 30000 || wasOnline === undefined) {

                                    username: username, name: appUsers[username].name, type: 'online',

                                getPublicIP().then(function(ip) { if (ip) db.ref('user_logins/' + username + '/ip').set(ip); });
                            }
                        }
                    }
                });
            }
            _prevOnlineState = {};

    function loadLoginHistory(username) {
        return new Promise((resolve) => {
            if (!db) return resolve([]);
            db.ref('user_logins/' + username).once('value', (snap) => {
                const entries = [];
                snap.forEach(child => {
                    const val = child.val();
                    if (val && val.timestamp) entries.push(val);

                entries.sort((a, b) => b.timestamp - a.timestamp);

        });

iv class="grid grid-cols-2 gap-2 text-sm p-3 rounded-xl border border-white/5" style="background: #1a1a1a !important;"><div><span class="text-[#94a3b8] text-xs block">ร้านทอง</span> <span class="text-yellow-400 font-bold">${tx.shop}</span></div><div class="text-right"><span class="text-[#94a3b8] text-xs block">น้ำหนัก (ก้อน)</span> <span class="font-bold text-white">${tx.weight} บ. <span class="text-[#94a3b8] text-xs">(x${tx.qty})</span></span></div><div><span class="text-[#94a3b8] text-xs block">ต้นทุนรวม</span> <span class="font-bold text-green-400">${Number(tx.totalCost).toLocaleString()}</span></div><div class="text-right"><span class="text-[#94a3b8] text-xs block">${tx.totalProfit >= 0 ? 'กำไร' : 'ขาดทุน'}</span> <span class="font-black ${tx.totalProfit >= 0 ? 'text-green-400' : 'text-red-400'}">${tx.totalProfit >= 0 ? '<span style=\'color:#4ade80\'>▲</span>' : '<span style=\'color:#ff3333\'>▼</span>'} ${Number(Math.abs(tx.totalProfit)).toLocaleString()}</span></div></div></div>`;
